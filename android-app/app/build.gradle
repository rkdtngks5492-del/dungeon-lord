plugins { id 'com.android.application' }

android {
    namespace 'com.dungeonlord.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.dungeonlord.game"   // ← 출시 전 본인 것으로 바꾸세요
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.0"
    }

    signingConfigs {
        /* 고정 디버그 키: 빌드 머신이 바뀌어도 서명이 같아서 덮어쓰기 설치가 된다 */
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // 시크릿이 있을 때만 서명한다. 없으면 서명 없이 빌드된다.
            def ks = file('keystore.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (file('keystore.jks').exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
