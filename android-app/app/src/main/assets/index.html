<script>
/* =========================================================
   마왕의 던전 - 프로토타입 v0.5
   - 자체 제작 3D 소프트 렌더러 (외부 라이브러리 없음)
   - 자유 카메라: 한 손가락 드래그 회전, 두 손가락 확대/축소
   - 유닛은 블록 조립 모델. MODEL 블록만 바꾸면 통째로 교체 가능
   - 관문(스테이지) 3개로 분할, 순차 해금
   ========================================================= */
const W = 360, H = 700, PANEL_Y = 516;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();
let T = 0, shake = 0;

/* ================= 3D 소프트 렌더러 ================= */
const LIGHT = (() => { const l = [0.42, 0.86, 0.3], m = Math.hypot(l[0], l[1], l[2]); return [l[0]/m, l[1]/m, l[2]/m]; })();
const CORN = [];
for (let i = 0; i < 8; i++) CORN.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
const FACES = [
  [4,5,7,6, 0,0,1], [1,0,2,3, 0,0,-1],
  [5,1,3,7, 1,0,0], [0,4,6,2, -1,0,0],
  [6,7,3,2, 0,1,0], [0,1,5,4, 0,-1,0],
];
const RT = { ctx:null, cam:null, cx:0, cy:0, fov:420, faces:[], n:0 };
const _vx = new Float32Array(8), _vy = new Float32Array(8), _vz = new Float32Array(8);
const _sx = new Float32Array(8), _sy = new Float32Array(8);

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) * k, g = ((n >> 8) & 255) * k, b = (n & 255) * k;
  r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function beginScene(c, cam, cx, cy, fov) { RT.ctx = c; RT.cam = cam; RT.cx = cx; RT.cy = cy; RT.fov = fov; RT.n = 0; }
function pushBox(px, py, pz, sw, sh, sd, col, yaw) {
  const cam = RT.cam;
  const cq = Math.cos(yaw || 0), sq = Math.sin(yaw || 0);
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const hw = sw / 2, hh = sh / 2, hd = sd / 2;
  for (let i = 0; i < 8; i++) {
    const o = CORN[i];
    const lx = o[0] * hw, ly = o[1] * hh, lz = o[2] * hd;
    const wx = px + lx * cq + lz * sq, wy = py + ly, wz = pz - lx * sq + lz * cq;
    const dx = wx - cam.tx, dy = wy - cam.ty, dz = wz - cam.tz;
    const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
    const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
    _vx[i] = x1; _vy[i] = vy; _vz[i] = vz;
    if (vz > 1) { const f = RT.fov / vz; _sx[i] = RT.cx + x1 * f; _sy[i] = RT.cy - vy * f; }
    else { _sx[i] = NaN; _sy[i] = NaN; }
  }
  for (let fi = 0; fi < 6; fi++) {
    const F = FACES[fi];
    const a = F[0], b = F[1], c2 = F[2], d2 = F[3];
    if (_vz[a] <= 1 || _vz[b] <= 1 || _vz[c2] <= 1 || _vz[d2] <= 1) continue;
    const nx0 = F[4], ny0 = F[5], nz0 = F[6];
    const wnx = nx0 * cq + nz0 * sq, wny = ny0, wnz = -nx0 * sq + nz0 * cq;
    const rx = wnx * cy1 + wnz * sy1, rz1 = -wnx * sy1 + wnz * cy1;
    const ry = wny * cp + rz1 * sp, rz = -wny * sp + rz1 * cp;
    const ccx = (_vx[a] + _vx[b] + _vx[c2] + _vx[d2]) * 0.25;
    const ccy = (_vy[a] + _vy[b] + _vy[c2] + _vy[d2]) * 0.25;
    const ccz = (_vz[a] + _vz[b] + _vz[c2] + _vz[d2]) * 0.25;
    if (rx * ccx + ry * ccy + rz * ccz >= 0) continue;
    const dot = wnx * LIGHT[0] + wny * LIGHT[1] + wnz * LIGHT[2];
    const k = 0.52 + 0.48 * (dot > 0 ? dot : 0) + (wny > 0.9 ? 0.08 : 0);
    const o = RT.faces[RT.n] || (RT.faces[RT.n] = { p:new Float32Array(8), z:0, c:'' });
    o.p[0] = _sx[a]; o.p[1] = _sy[a]; o.p[2] = _sx[b]; o.p[3] = _sy[b];
    o.p[4] = _sx[c2]; o.p[5] = _sy[c2]; o.p[6] = _sx[d2]; o.p[7] = _sy[d2];
    o.z = ccz; o.c = shade(col, k); RT.n++;
  }
}
function endScene() {
  const arr = RT.faces.slice(0, RT.n);
  arr.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (let i = 0; i < arr.length; i++) {
    const o = arr[i], p = o.p;
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.lineTo(p[4], p[5]); c.lineTo(p[6], p[7]); c.closePath();
    c.fillStyle = o.c; c.fill();
  }
}
function proj(x, y, z, cam) {
  cam = cam || RT.cam;
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
  if (vz <= 1) return null;
  const f = RT.fov / vz;
  return [RT.cx + x1 * f, RT.cy - vy * f, vz];
}
function ground3(cx, cz, r, col, lw, seg) {
  seg = seg || 28; const c = RT.ctx; c.beginPath();
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * Math.PI * 2, p = proj(cx + Math.cos(a) * r, 1, cz + Math.sin(a) * r);
    if (!p) return; i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]);
  }
  c.closePath(); c.strokeStyle = col; c.lineWidth = lw || 2; c.stroke();
}

/* ================= 일러스트(빌보드) ================= */
/* ART_IMG에 키별로 이미지 data URI를 넣으면 블록 모델 대신 그 그림을 세워서 그린다.
   비어 있으면 기존 블록 모델이 그대로 쓰인다. */
const ART_IMG = {};
const _IMG = {};
/* 새 그림이 오기 전까지 기존 스프라이트에 색만 입혀 쓰는 캐릭터: 키 → [원본 키, 색] */
const ART_TINT = {
};
function tintOf(im, col) {
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 0.45; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  c.naturalWidth = c.width; c.naturalHeight = c.height; c.complete = true;
  return c;
}
function unitImg(key) {
  const tn = ART_TINT[key];
  if (tn) { if (_IMG[key]) return _IMG[key]; const b = unitImg(tn[0]); return b ? (_IMG[key] = tintOf(b, tn[1])) : null; }
  const src = ART_IMG[key]; if (!src) return null;
  let im = _IMG[key];
  if (!im) { im = _IMG[key] = new Image(); im.src = src; }
  return im.complete && im.naturalWidth ? im : null;
}
/* 피격 섬광용 흰색 실루엣(도감 미발견은 검은색)을 한 번만 만들어 캐시 */
const _WH = new Map();
function whiteOf(im, col) {
  col = col || '#fff';
  let cache = _WH.get(col); if (!cache) _WH.set(col, cache = new Map());
  if (cache.has(im)) return cache.get(im);
  let w = null;
  try {
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    w = c;
  } catch (e) { w = null; }
  cache.set(im, w); return w;
}
const BB = [], NOOPT = {};
/* o = { flip, tilt, sx, sy, alpha, flash, shadow } */
function pushBillboard(im, x, y, z, h, o, groundY) {
  const p = proj(x, y, z); if (!p) return;
  let g = null;
  if (groundY !== undefined) { const q = proj(x, groundY, z); if (q) g = q; }
  BB.push({ x:p[0], y:p[1], z:p[2], im, h:h * (RT.fov / p[2]), o:o || NOOPT, g, k:RT.fov / p[2] });
}
function drawBillboards() {
  if (!BB.length) return;
  BB.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (const b of BB) {
    const o = b.o;
    const base = b.h / b.im.naturalHeight;
    const w = b.im.naturalWidth * base * (o.sx || 1), h = b.h * (o.sy || 1);
    if (b.g && o.shadow !== false) {
      c.save(); c.globalAlpha = 0.34 * (o.alpha === undefined ? 1 : o.alpha);
      c.fillStyle = '#000'; c.beginPath();
      c.ellipse(b.g[0], b.g[1], w * 0.3, w * 0.11, 0, 0, 7); c.fill(); c.restore();
    }
    c.save();
    c.translate(b.x, b.y);
    if (o.tilt) c.rotate(o.tilt);
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;
    if (o.flip) c.scale(-1, 1);
    c.drawImage(b.im, -w / 2, -h, w, h);
    if (o.flash > 0) {
      const wi = whiteOf(b.im);
      if (wi) { c.globalAlpha = (o.alpha === undefined ? 1 : o.alpha) * Math.min(1, o.flash); c.drawImage(wi, -w / 2, -h, w, h); }
    }
    c.restore();
  }
  BB.length = 0;
}

/* 비율을 유지한 채 주어진 상자 안에 맞춰 그린다 (아래 정렬) */
function fitImg(c, im, cx, by, maxW, maxH) {
  const k = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  c.drawImage(im, cx - w / 2, by - h, w, h);
}

/* ================= 블록 모델 ================= */
/* 유닛 공간: 발끝 y=0, 키 ≈ 1.0, 정면 = +Z. [x,y,z, w,h,d, color, yaw] */
function dk(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) * k) | 0, g = Math.min(255, ((n >> 8) & 255) * k) | 0, b = Math.min(255, (n & 255) * k) | 0;
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

  greatsword(P, a) {

  axe(P, a) {

  bow(P, a) {

  golem(a) {

function dexFound(tab) { return CODEX[tab].keys.filter(k => dexHas(tab, k)).length; }
function dexCanClaim(tab, i) { return !SAVE.dexGot[tab + i] && dexFound(tab) >= Math.ceil(CODEX[tab].tiers[i].at * CODEX[tab].keys.length - 1e-9); }
function dexTabCan(tab) { return CODEX[tab].tiers.some((t, i) => dexCanClaim(tab, i)); }
function dexAnyClaim() { return Object.keys(CODEX).some(dexTabCan); }
function dexClaim(tab, i) {
  if (!dexCanClaim(tab, i)) return;
  SAVE.dexGot[tab + i] = 1; grant({ soul:CODEX[tab].tiers[i].soul }, 1);
}
function dexBonus() {
  const b = { minAtk:0, minHp:0, all:0, trapDmg:0, trapSlot:0, heroGem:0, lordHp:0 };
  for (const t in CODEX) CODEX[t].tiers.forEach((r, i) => { if (SAVE.dexGot[t + i]) for (const k in r.fx) b[k] = (b[k] || 0) + r.fx[k]; });
  return b;
}

/* ================= 보상 ================= */
function dq() {
  const q = SAVE.dq;
  if (!q || q.day !== todayKey() || typeof q.prog !== 'object' || typeof q.got !== 'object') SAVE.dq = { day:todayKey(), prog:{}, got:{}, all:false };
  return SAVE.dq;
}
function questAdd(id, n) { const q = dq(); q.prog[id] = (q.prog[id] || 0) + (n || 1); }
function questDone(Q) { return (dq().prog[Q.id] || 0) >= Q.need; }
function questCan(Q) { return questDone(Q) && !dq().got[Q.id]; }
function questAllCan() { return !dq().all && DAILY_QUESTS.every(questDone); }
function attCan() { return SAVE.att.day !== todayKey(); }
function boxLeft() {
  const now = Date.now();
  if (!(SAVE.boxT <= now)) SAVE.boxT = now;   /* 시계가 거꾸로 갔으면 지금부터 다시 */
  return Math.max(0, SAVE.boxT + BOX.hours * 3600000 - now);
}
function mailCan() { return MAIL.some(m => !SAVE.mailGot[m.id]); }
/* 별 기록이 없는 옛 저장의 돌파 관문은 별 1개로 본다 */
function starsOf(i) { return SAVE.stars[i] || (SAVE.cleared > i ? 1 : 0); }
function clrPend(i) { return (SAVE.clr.s[i] || 0) < starsOf(i); }
/* 별 보상 = ◆ + 권속 조각. 조각 종류는 그 관문에 가장 많이 나오는 적 역할을 잘 받아치는 권속,
   등급은 뒤 관문·높은 별일수록 높고(일반→희귀→영웅→전설), 개수는 별과 관문 난이도를 따른다 */
const COUNTER = { tank:'ranged', melee:'tank', assassin:'tank', ranged:'assassin', support:'assassin' };
const RARS = ['N', 'R', 'SR', 'SSR'];
function starCard(i, s) {
  const S = STAGES[i], cnt = {};
  for (let w = S.from; w <= S.to; w++) for (const r of WAVES[w]) { const ro = DEF[r[0]].role; cnt[ro] = (cnt[ro] || 0) + r[1]; }
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0], rar = RARS[Math.min(3, Math.floor(i / 5) + (s === 2 ? 1 : 0))];
  let pool = MINIONS.filter(k => DEF[k].rar === rar && DEF[k].role === COUNTER[top]);
  if (!pool.length) pool = MINIONS.filter(k => DEF[k].rar === rar);
  const key = pool[Math.floor(rng32(i * 31 + s * 7 + 5)() * pool.length)];
  let n = s + 1 + (i % 5 >= 3 ? 1 : 0);
  if (RAR_RANK[rar] >= 2) n = Math.ceil(n / 2);
  return { key, n };
}
function starRew(i, s) { return { gems:CLEAR_REWARD.stars[s] || 0, cards:[starCard(i, s)] }; }
/* 아직 안 받은 별 보상을 하나로 합친다 */
function clrStageRew(i) {
  const r = { gems:0, cards:[] };
  for (let s = SAVE.clr.s[i] || 0; s < starsOf(i); s++) {
    const q = starRew(i, s); r.gems += q.gems;
    for (const c of q.cards) { const o = r.cards.find(x => x.key === c.key); if (o) o.n += c.n; else r.cards.push({ key:c.key, n:c.n }); }
  }
  return r;
}
function clrMileCan(n) { return SAVE.cleared >= n && !SAVE.clr.m[n]; }
function clrCan() { return STAGES.some((S, i) => clrPend(i)) || Object.keys(CLEAR_REWARD.milestone).some(clrMileCan); }
function rewardDots() {
  return { quest:DAILY_QUESTS.some(questCan) || questAllCan(), att:attCan(), box:boxLeft() <= 0, mail:mailCan(), clear:clrCan() };
}
function rewardAny() { const d = rewardDots(); return d.quest || d.att || d.box || d.mail || d.clear; }

function rollRarity() { const r = Math.random() * 100; return r < 1 ? 'SSR' : r < 8 ? 'SR' : r < 35 ? 'R' : 'N'; }
/* 관문 진행으로 풀리는 함정: unlock 관문을 돌파해야 함정 소환에 나온다 */
function trapOpen(k) { return !DEF[k].unlock || SAVE.cleared >= DEF[k].unlock; }
/* 관문을 처음 돌파했을 때 이번에 풀린 함정을 1장씩 준다 */
function grantUnlockedTraps() {
  const got = TRAPSL.filter(k => DEF[k].unlock === SAVE.cleared && !SAVE.own[k]);
  for (const k of got) gainCard(k);
  if (got.length) { G.newTraps = got; toast('새 함정 해금: ' + got.map(k => DEF[k].name).join(', ')); }
}
function pickFrom(pool, rar) { const p = pool.filter(k => DEF[k].rar === rar); return p[Math.floor(Math.random() * p.length)]; }
/* 카드 한 장 얻기: 처음이면 등록, 권속 중복은 승급 카드, 함정 중복은 레벨 업(최대 5) 후 ◆ 환급 */
function gainCard(key) {
  const o = { key, isNew:false, lvUp:false, refund:0, card:false };
  if (!SAVE.own[key]) {
    SAVE.own[key] = 1; o.isNew = true;
    const team = DEF[key].kind === 'minion' ? SAVE.mteam : SAVE.tteam;
    const cap = DEF[key].kind === 'minion' ? mSlots() : tSlots();
    if (team.length < cap) team.push(key);
  } else if (DEF[key].kind === 'minion') { SAVE.cards[key] = cardsOf(key) + 1; o.card = true; }
  else if (SAVE.own[key] < MAX_LV) { SAVE.own[key]++; o.lvUp = true; }
  else { o.refund = 15; SAVE.gems += 15; }
  return o;
}
function showCards(res) {
  persist(); L.result = res;
  SFX.pull();
  let top = 'N'; for (const o of res) if (RAR_RANK[DEF[o.key].rar] > RAR_RANK[top]) top = DEF[o.key].rar;
  setTimeout(() => SFX.reveal(top), 260);
}
function doPull(cat, n, free, cost) {
  const pool = cat === 'minion' ? MINIONS : TRAPSL.filter(trapOpen);
  if (cost === undefined) cost = n === 10 ? PULL_COST[cat].ten : PULL_COST[cat].one;
  /* 무료 소환권: 권속 1회 소환에 먼저 쓴다 */
  if (!free && cat === 'minion' && n === 1 && (SAVE.tickets | 0) > 0) { SAVE.tickets--; free = true; }
  if (!free) { if (SAVE.soul < cost) { toast(CUR.soul.name + '이 부족해요. 상점과 보상에서 모아보세요'); return; } SAVE.soul -= cost; }
  if (cat === 'minion') questAdd('pull');
  const res = []; let rare = false;
  for (let i = 0; i < n; i++) {
    let r = rollRarity();
    if (n >= 5 && i === n - 1 && !rare) { while (RAR_RANK[r] < 1) r = rollRarity(); }   /* ×10·카드팩: 희귀 이상 1장 보장 */
    if (RAR_RANK[r] >= 1) rare = true;
    /* 튜토리얼 첫 소환은 아직 없는 일반 권속이 반드시 나온다 */
    const tk = cat === 'minion' && tutStep() && tutStep().id === 'pull' ? MINIONS.filter(k => DEF[k].rar === 'N' && !SAVE.own[k]) : [];
    const key = tk.length ? tk[Math.floor(Math.random() * tk.length)] : pickFrom(pool, r);
    res.push(gainCard(key));
    /* 튜토리얼에서는 편성을 직접 해 보도록 자동 편성을 되돌린다 */
    if (tk.length) { SAVE.tut.newKey = key; const ti = SAVE.mteam.indexOf(key); if (ti >= 0) SAVE.mteam.splice(ti, 1); }
  }
  L.tab = cat; showCards(res);
}
function buyPack() { doPull('minion', CARD_PACK.n, false, CARD_PACK.soul); }
/* 일일 상자: 하루 무료 1회 + 광고 1회, 권속 카드 1~3장 */
function dailyBoxState() { const t = todayKey(); return { free:SAVE.dbDay !== t, ad:SAVE.dbDay === t && SAVE.dbAdDay !== t }; }
function openDailyBox(ad) {
  const st = dailyBoxState();
  if (ad ? !st.ad : !st.free) { toast(ad ? '광고 상자는 무료 상자를 연 뒤 하루 1번이에요' : '오늘 무료 상자는 이미 열었어요'); return; }
  const go = () => {
    if (ad) SAVE.dbAdDay = todayKey(); else SAVE.dbDay = todayKey();
    const R = DAILY_BOX.rates, tot = Object.values(R).reduce((a, b) => a + b, 0);
    const n = DAILY_BOX.min + Math.floor(Math.random() * (DAILY_BOX.max - DAILY_BOX.min + 1)), res = [];
    for (let i = 0; i < n; i++) {
      let x = Math.random() * tot, rar = 'N';
      for (const k in R) { if (x < R[k]) { rar = k; break; } x -= R[k]; }
      res.push(gainCard(pickFrom(MINIONS, rar)));
    }
    L.tab = 'minion'; showCards(res);
  };
  if (ad) ADS.rewarded('일일 상자', ok => { if (ok) go(); }); else go();
}
function toggleTeam(key) {
  if (!SAVE.own[key]) { toast('아직 얻지 못한 카드예요'); return; }
  const isM = DEF[key].kind === 'minion';
  const team = isM ? SAVE.mteam : SAVE.tteam, cap = isM ? mSlots() : tSlots();
  const i = team.indexOf(key);
  if (i >= 0) team.splice(i, 1);
  else if (team.length >= cap) { toast((isM ? '권속' : '함정') + ' 칸이 ' + cap + '칸으로 꽉 찼어요 · 먼저 하나를 빼세요'); return; }
  else team.push(key);
  questAdd('deck');
  persist();
}

/* ================= 효과음 (Web Audio 합성, 음원 파일 없음) ================= */
const SFX = (() => {
  let ctx = null, master = null, nbuf = null;
  const last = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
    nbuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  }
  function env(node, t0, dur, peak) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    node.connect(g); g.connect(master);
  }
  function osc(f1, f2, dur, type, vol, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(); o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
      env(o, t0, dur, vol === undefined ? 0.2 : vol);
      o.start(t0); o.stop(t0 + dur + 0.06);
    }
  }
  function nz(dur, vol, lp, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const s = ctx.createBufferSource(); s.buffer = nbuf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 2200;
      s.connect(f); env(f, t0, dur, vol === undefined ? 0.2 : vol);

  const SND = { slime:'squish', goblin:'blade', bat:'bite', skel:'bow', imp:'blunt', ghost:'dark', golem:'stone', witch:'dark', dragon:'breath',

function drawPlates(Q) {
  if (!Q.length) return;
  const out = [];
  for (const q of Q) {
    const s2 = proj(q[1], q[2], q[3]); if (!s2) continue;
    const k = RT.fov / s2[2];
    let r = 13 * k; if (r < 6) r = 6; if (r > 20) r = 20;
    if (q[7] === 2) r *= 0.72;
    out.push({ z:s2[2], x:s2[0], y:s2[1] - q[6] * k - r - 5, r, q });
  }
  /* 가까운 것부터 자리를 잡고, 겹치는 것은 위로 밀어 올려 서로 가리지 않게 한다 */
  out.sort((a, b) => a.z - b.z);

  for (const o of out) {
    const w = o.q[5] >= 0 ? o.r * 3.4 : o.r * 2;
    o.l = o.x - o.r; o.rr = o.x - o.r + w;
    for (let t = 0; t < 14; t++) {

      for (const u of put) {
        if (o.rr < u.l || o.l > u.rr) continue;
        const gap = (o.r + u.r) * 0.92;
        if (Math.abs(o.y - u.y) < gap) { o.y = u.y - gap; hit = true; }

      if (!hit) break;

      ctx.fillStyle = 'rgba(8,5,14,.75)'; rbox(bx - 2, by - 2, bw + 4, bh + 4, bh * 0.7 + 2); ctx.fill();
      ctx.fillStyle = 'rgba(44,32,58,.95)'; rbox(bx, by, bw, bh, bh * 0.5); ctx.fill();
      const w2 = Math.max(bh, bw * Math.max(0, Math.min(1, hp)));
      ctx.fillStyle = hero ? '#e8574c' : '#5fd071'; rbox(bx, by, w2, bh, bh * 0.5); ctx.fill();

    ctx.globalAlpha = 1;
  }
}

  /* 미보유는 언제나 맨 뒤 */
  return pool.filter(k => f === 'all' || DEF[k].rar === f).sort((a, b) => (SAVE.own[b] ? 1 : 0) - (SAVE.own[a] ? 1 : 0) || key(b) - key(a));
}

/* ================= 경쟁전: 관문 랭킹 =================
   구글 플레이 게임즈 리더보드 하나에 숫자 하나로 제출한다.
   점수 = 돌파 관문 수 × 1,000,000 + 무한 최고 층(최대 9,999) × 100 + 관문별 남은 수호석 % 평균(0~99)
   → 관문 수가 같으면 무한 층, 그것도 같으면 수호석 평균으로 갈린다. 자리가 겹치지 않고 최댓값은 15,999,999.
   점수가 오를 때만 제출하고, 동점은 먼저 달성한 쪽이 위(플레이 게임즈 규칙).
   네이티브(MainActivity의 AndroidGames)가 없거나 리더보드 ID가 비어 있으면 테스트용 더미 데이터로 화면을 그린다. */
const RANK = { CLEAR:1000000, FLOOR:100, FLOOR_MAX:9999, PCT_MAX:99 };
function rankScore(c, fl, pct) { return c * RANK.CLEAR + Math.min(RANK.FLOOR_MAX, fl | 0) * RANK.FLOOR + Math.min(RANK.PCT_MAX, pct | 0); }
function rankParts(s) { return { clear:Math.floor(s / RANK.CLEAR), floor:Math.floor(s % RANK.CLEAR / RANK.FLOOR), pct:s % RANK.FLOOR }; }
/* 돌파한 관문들의 남은 수호석 최고 기록 평균 */
function stonePctAvg() {
  const n = Math.min(SAVE.cleared, STAGES.length); if (!n) return 0;
  let s = 0; for (let i = 0; i < n; i++) s += SAVE.stoneBest[i] || 0;
  return Math.min(RANK.PCT_MAX, Math.floor(s / n));
}
function myRankScore() { return rankScore(Math.min(SAVE.cleared, STAGES.length), SAVE.endlessBest, stonePctAvg()); }
function gamesNative() { const g = window.AndroidGames; try { return g && g.isConfigured && g.isConfigured() ? g : null; } catch (e) { return null; } }
/* 점수가 올랐을 때만 제출 (내려가는 제출은 하지 않는다) */
function rankSubmit() {
  const s = myRankScore();
  if (s <= (SAVE.rankSent || 0)) return false;
  SAVE.rankSent = s; persist();
  const g = gamesNative(); if (g) try { g.submit(String(s)); } catch (e) {}
  return true;
}
/* 관문 돌파 기록: 남은 수호석 %가 더 좋을 때만 그 관문 기록을 갈아 끼운다 */
function rankRecordStage(i, pct) {
  pct = Math.max(0, Math.min(100, Math.floor(pct)));
  SAVE.stoneBest[i] = Math.max(SAVE.stoneBest[i] || 0, pct);
}
/* 업데이트 후 첫 실행: 수호석 기록이 없던 관문은 별 개수로 하한을 추정(★3 80% · ★2 50% · ★1 0%)하고 한 번 제출 */

/* ================= 전투 3D ================= */
const ZONE_X0 = 50, ZONE_X1 = 310, ZONE_W = ZONE_X1 - ZONE_X0;
/* 정지 그림 한 장으로 생동감을 만드는 자세 계산.
   숨쉬기 / 걷기 통통 / 공격 준비-내지름 / 피격 떨림·납작 / 등장 */
function pose(u, baseY) {
  const atk = u.atk > 0 ? u.atk : 0, hit = u.hitT > 0 ? u.hitT : 0;
  const walk = u.moving > 0 ? u.moving : 0, sp = u.spawnT > 0 ? u.spawnT : 0;
  const t = T + (u.bobOff || 0);
  const idle = Math.sin(t * 2.3) * 1.3;
  const step = walk * Math.abs(Math.sin(t * 9.5)) * 5;
  /* 준비(천천히 뒤로) → 가격(순간적으로 앞으로) → 복귀(부드럽게) */
  let push = 0, tilt = 0;
  if (atk > 0) {
    const pr = 1 - atk;
    if (pr < 0.30) { const k = pr / 0.30, e = 1 - Math.pow(1 - k, 3); push = -7 * e; tilt = 0.17 * e; }
    else if (pr < 0.46) { const k = (pr - 0.30) / 0.16, e = k * k; push = -7 + 26 * e; tilt = 0.17 - 0.45 * e; }
    else { const k = (pr - 0.46) / 0.54, e = 1 - Math.pow(1 - k, 3); push = 19 * (1 - e); tilt = -0.28 * (1 - e); }
  }
  tilt += walk * Math.sin(t * 9.5) * 0.05;
  const shk = hit > 0 ? (Math.random() - 0.5) * 6 * hit : 0;
  const sx = (1 + walk * 0.04 - hit * 0.12 + atk * 0.04) * (1 - sp * 0.35);
  const sy = (1 - walk * 0.05 + hit * 0.14 - atk * 0.03) * (1 - sp * 0.35);
  return { y:baseY + idle + step + sp * 30, push, shk, kx:u.kbx || 0, kz:u.kbz || 0,
           o:{ tilt, sx, sy, flash:hit, alpha:1 - sp * 0.7, flip:Math.sin((u.yaw || 0) + cam.yaw) < 0 } };
}

function drawScene() {

    const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz), yaw = Math.atan2(dx, dz), cc = ZCOL[zc === undefined ? 3 : zc][1];

    }

  }
  { const pp = ROADS[0].pts; for (let i = ROADS[0].nPre; i < pp.length - 1; i++) { const L0 = Math.hypot(pp[i + 1][0] - pp[i][0], pp[i + 1][1] - pp[i][1]); const ring = LAYOUT.loop && i > ROADS[0].nPre && i < pp.length - 3; roadSeg(pp[i][0], pp[i][1], pp[i + 1][0], pp[i + 1][1], ring ? 50 : 90, Math.max(1, Math.ceil(L0 / (ring ? 16 : 40))), 3); } }   /* 고리 구간은 좁게 */

  if (G.blocks) for (const k of G.blocks) drawModel(TRAPM.rock(), k.x, 9, k.z, 46, 0);   /* 무너진 천장 잔해 */
  for (const h of G.heroes) {

  /* 쓰러진 유닛: 옆으로 넘어지며 사라진다 */

    const im = unitImg(c.key); if (!im) continue;

    bbQ.push([im, c.x, 9, c.z, c.def.sc * 1.55,
      { tilt:c.dir * 1.45 * Math.min(1, k * 1.8), alpha:Math.min(1, c.t * 1.6),

  for (const m of G.meteors) {

  /* --- 3D 위에 겹치는 2D 표시 --- */

  for (const h of G.heroes) if (h.shield > 0) {

  if (G.phase === 'run') for (let i = 0; i < NROOM; i++) {

    ctx.save(); ctx.globalAlpha = b.spent ? 0.3 : 0.7;
    ctx.fillStyle = 'rgba(12,8,20,.8)'; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 7); ctx.fill();

    else { ctx.font = (r * 1.2) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.def.ico, q[0], q[1] + 0.5); }

    }

  }

  if (DBG.on) drawDebug();
  /* 교전 중인 자리: 붉은 원 */

  }

  if (G.frenzy > 0) for (const b of G.rooms) if (b && b.def.kind === 'minion') ground3(b.x, b.z, 24, 'rgba(255,90,90,.7)', 2, 14);

    if (q) { ctx.globalAlpha = 0.6; ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(p[0], p[1], 2.4 * (540 / p[2]) + 1.2, 0, 7); ctx.fill();
  }
  for (const p of G.parts) {

    ctx.globalAlpha = Math.min(1, p.life / 0.4); ctx.fillStyle = p.col;
    const r = p.sz * (540 / s[2]); ctx.beginPath(); ctx.arc(s[0], s[1], Math.max(0.6, r), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < G.rooms.length; i++) {
    const b = G.rooms[i];
    if (!b) {
      if (i >= NROOM) continue;
      const s = proj(ROOMS[i].x, 10, ROOMS[i].z); if (!s) continue;
      const rv = G.revive.find(v => v.i === i);
      if (rv) {
        ctx.globalAlpha = 0.55;
        txt('쓰러짐', s[0], s[1] - 4, 10, '#8a7aa5', 'center');

    }
    else if (b.def.kind === 'minion') {
      const s = proj(b.x, b.def.sc * (unitImg(b.key) ? 1.62 : 1.3), b.z); if (!s) continue;
      const w = 30 * (540 / s[2]) * 1.2; bar2(s[0] - w / 2, s[1] - 4, w, 4, b.hp / b.maxHp, '#6bdc7a');
    }

  if (G.seal > 0) { ctx.fillStyle = 'rgba(90,180,255,.12)'; ctx.fillRect(0, 0, W, PANEL_Y); }

/* ================= 전투 UI ================= */
/* 웨이브 시작 전: 어느 길로 어떤 무리가 오는지 미리 보여 준다 (입구 쪽 빈 자리에 작게) */
function drawPreview() {
  if (G.phase !== 'prep' || !G.plan) return;
  for (let r = 0; r < 3; r++) {
    const P = G.plan.find(p => p.road === r);
    const e0 = pathPos(r, ROADS[r].dFork - 40), q = proj(e0[0], 4, e0[1]); if (!q) continue;
    const cw = 58, cx = Math.max(cw / 2 + 3, Math.min(W - cw / 2 - 3, q[0]));
    const cnt = {}, order = [];

  if (ADV.on || ADV.wait) return;                         /* 광고 중에는 게임에 영향 없음 */

  if (L.result) { L.result = null; return; }
  if (M) { M = null; return; }
  if (scene === 'game') {
    if (G.phase === 'win' || G.phase === 'lose') { goStages(); return; }
    if (G.paused) { if (G.paused.conf) G.paused.conf = null; else G.paused = null; return; }

};

/* 매 프레임: 처음 들어온 단계면 준비 동작, 조건이 끝났으면 다음 단계로 */
function tutTick() {
  for (let guard = 0; guard < 4 && tutOn(); guard++) {
    const st = tutStep();
    if (SAVE.tut.e !== SAVE.tut.s) { SAVE.tut.e = SAVE.tut.s; if (st.enter) st.enter(); }
    if (st.battle && scene !== 'game') { SAVE.tut.s = TUT.findIndex(t => t.id === 'toBattle'); SAVE.tut.e = -1; persist(); continue; }
