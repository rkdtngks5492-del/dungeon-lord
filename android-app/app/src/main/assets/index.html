<!-- 수치 데이터: 화폐·행동력·강화 / 도감 / 보상. 숫자는 이 파일들에서 고친다 -->

<script>
/* =========================================================
   마왕의 던전 - 프로토타입 v0.5
   - 자체 제작 3D 소프트 렌더러 (외부 라이브러리 없음)
   - 자유 카메라: 한 손가락 드래그 회전, 두 손가락 확대/축소
   - 유닛은 블록 조립 모델. MODEL 블록만 바꾸면 통째로 교체 가능
   - 관문(스테이지) 3개로 분할, 순차 해금
   ========================================================= */
const W = 360, H = 700, PANEL_Y = 516;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();
let T = 0, shake = 0;

/* ================= 3D 소프트 렌더러 ================= */
const LIGHT = (() => { const l = [0.42, 0.86, 0.3], m = Math.hypot(l[0], l[1], l[2]); return [l[0]/m, l[1]/m, l[2]/m]; })();
const CORN = [];
for (let i = 0; i < 8; i++) CORN.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
const FACES = [
  [4,5,7,6, 0,0,1], [1,0,2,3, 0,0,-1],
  [5,1,3,7, 1,0,0], [0,4,6,2, -1,0,0],
  [6,7,3,2, 0,1,0], [0,1,5,4, 0,-1,0],
];
const RT = { ctx:null, cam:null, cx:0, cy:0, fov:420, faces:[], n:0 };
const _vx = new Float32Array(8), _vy = new Float32Array(8), _vz = new Float32Array(8);
const _sx = new Float32Array(8), _sy = new Float32Array(8);

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) * k, g = ((n >> 8) & 255) * k, b = (n & 255) * k;
  r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function beginScene(c, cam, cx, cy, fov) { RT.ctx = c; RT.cam = cam; RT.cx = cx; RT.cy = cy; RT.fov = fov; RT.n = 0; }
function pushBox(px, py, pz, sw, sh, sd, col, yaw) {
  const cam = RT.cam;
  const cq = Math.cos(yaw || 0), sq = Math.sin(yaw || 0);
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const hw = sw / 2, hh = sh / 2, hd = sd / 2;
  for (let i = 0; i < 8; i++) {
    const o = CORN[i];
    const lx = o[0] * hw, ly = o[1] * hh, lz = o[2] * hd;
    const wx = px + lx * cq + lz * sq, wy = py + ly, wz = pz - lx * sq + lz * cq;
    const dx = wx - cam.tx, dy = wy - cam.ty, dz = wz - cam.tz;
    const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
    const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
    _vx[i] = x1; _vy[i] = vy; _vz[i] = vz;
    if (vz > 1) { const f = RT.fov / vz; _sx[i] = RT.cx + x1 * f; _sy[i] = RT.cy - vy * f; }
    else { _sx[i] = NaN; _sy[i] = NaN; }
  }
  for (let fi = 0; fi < 6; fi++) {
    const F = FACES[fi];
    const a = F[0], b = F[1], c2 = F[2], d2 = F[3];
    if (_vz[a] <= 1 || _vz[b] <= 1 || _vz[c2] <= 1 || _vz[d2] <= 1) continue;
    const nx0 = F[4], ny0 = F[5], nz0 = F[6];
    const wnx = nx0 * cq + nz0 * sq, wny = ny0, wnz = -nx0 * sq + nz0 * cq;
    const rx = wnx * cy1 + wnz * sy1, rz1 = -wnx * sy1 + wnz * cy1;
    const ry = wny * cp + rz1 * sp, rz = -wny * sp + rz1 * cp;
    const ccx = (_vx[a] + _vx[b] + _vx[c2] + _vx[d2]) * 0.25;
    const ccy = (_vy[a] + _vy[b] + _vy[c2] + _vy[d2]) * 0.25;
    const ccz = (_vz[a] + _vz[b] + _vz[c2] + _vz[d2]) * 0.25;
    if (rx * ccx + ry * ccy + rz * ccz >= 0) continue;
    const dot = wnx * LIGHT[0] + wny * LIGHT[1] + wnz * LIGHT[2];
    const k = 0.52 + 0.48 * (dot > 0 ? dot : 0) + (wny > 0.9 ? 0.08 : 0);
    const o = RT.faces[RT.n] || (RT.faces[RT.n] = { p:new Float32Array(8), z:0, c:'' });
    o.p[0] = _sx[a]; o.p[1] = _sy[a]; o.p[2] = _sx[b]; o.p[3] = _sy[b];
    o.p[4] = _sx[c2]; o.p[5] = _sy[c2]; o.p[6] = _sx[d2]; o.p[7] = _sy[d2];
    o.z = ccz; o.c = shade(col, k); RT.n++;
  }
}
function endScene() {
  const arr = RT.faces.slice(0, RT.n);
  arr.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (let i = 0; i < arr.length; i++) {
    const o = arr[i], p = o.p;
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.lineTo(p[4], p[5]); c.lineTo(p[6], p[7]); c.closePath();
    c.fillStyle = o.c; c.fill();
  }
}
function proj(x, y, z, cam) {
  cam = cam || RT.cam;
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
  if (vz <= 1) return null;
  const f = RT.fov / vz;
  return [RT.cx + x1 * f, RT.cy - vy * f, vz];
}
function ground3(cx, cz, r, col, lw, seg) {
  seg = seg || 28; const c = RT.ctx; c.beginPath();
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * Math.PI * 2, p = proj(cx + Math.cos(a) * r, 1, cz + Math.sin(a) * r);
    if (!p) return; i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]);
  }
  c.closePath(); c.strokeStyle = col; c.lineWidth = lw || 2; c.stroke();
}

/* ================= 일러스트(빌보드) ================= */
/* ART_IMG에 키별로 이미지 data URI를 넣으면 블록 모델 대신 그 그림을 세워서 그린다.
   비어 있으면 기존 블록 모델이 그대로 쓰인다. */
const ART_IMG = {};
const _IMG = {};
/* 새 그림이 오기 전까지 기존 스프라이트에 색만 입혀 쓰는 캐릭터: 키 → [원본 키, 색] */
const ART_TINT = {
  rookie:['trainee', '#c08a4a'], archer:['ranger', '#a8d860'], thief:['looter', '#8a6a3a'],
  holyknight:['paladin', '#c77dff'], archmage:['warlock', '#b05aff'], assassinlord:['looter', '#9a1a3a'], assassin:['looter', '#3a1a5a'],
  brave:['champion', '#ffd35a'], saint:['cleric', '#ffc0e0'], swordmaster:['champion', '#5ac8ff'], sage:['warlock', '#ffe9a8'],
  heroking:['champion', '#c77dff'],
};
function tintOf(im, col) {
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 0.45; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  c.naturalWidth = c.width; c.naturalHeight = c.height; c.complete = true;
  return c;
}
function unitImg(key) {
  const tn = ART_TINT[key];
  if (tn) { if (_IMG[key]) return _IMG[key]; const b = unitImg(tn[0]); return b ? (_IMG[key] = tintOf(b, tn[1])) : null; }
  const src = ART_IMG[key]; if (!src) return null;
  let im = _IMG[key];
  if (!im) { im = _IMG[key] = new Image(); im.src = src; }
  return im.complete && im.naturalWidth ? im : null;
}
/* 피격 섬광용 흰색 실루엣(도감 미발견은 검은색)을 한 번만 만들어 캐시 */
const _WH = new Map();
function whiteOf(im, col) {
  col = col || '#fff';
  let cache = _WH.get(col); if (!cache) _WH.set(col, cache = new Map());
  if (cache.has(im)) return cache.get(im);
  let w = null;
  try {
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    w = c;
  } catch (e) { w = null; }
  cache.set(im, w); return w;
}
const BB = [], NOOPT = {};
/* o = { flip, tilt, sx, sy, alpha, flash, shadow } */
function pushBillboard(im, x, y, z, h, o, groundY) {
  const p = proj(x, y, z); if (!p) return;
  let g = null;
  if (groundY !== undefined) { const q = proj(x, groundY, z); if (q) g = q; }
  BB.push({ x:p[0], y:p[1], z:p[2], im, h:h * (RT.fov / p[2]), o:o || NOOPT, g, k:RT.fov / p[2] });
}
function drawBillboards() {
  if (!BB.length) return;
  BB.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (const b of BB) {
    const o = b.o;
    const base = b.h / b.im.naturalHeight;
    const w = b.im.naturalWidth * base * (o.sx || 1), h = b.h * (o.sy || 1);
    if (b.g && o.shadow !== false) {
      c.save(); c.globalAlpha = 0.34 * (o.alpha === undefined ? 1 : o.alpha);
      c.fillStyle = '#000'; c.beginPath();
      c.ellipse(b.g[0], b.g[1], w * 0.3, w * 0.11, 0, 0, 7); c.fill(); c.restore();
    }
    c.save();
    c.translate(b.x, b.y);
    if (o.tilt) c.rotate(o.tilt);
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;
    if (o.flip) c.scale(-1, 1);
    c.drawImage(b.im, -w / 2, -h, w, h);
    if (o.flash > 0) {
      const wi = whiteOf(b.im);
      if (wi) { c.globalAlpha = (o.alpha === undefined ? 1 : o.alpha) * Math.min(1, o.flash); c.drawImage(wi, -w / 2, -h, w, h); }
    }
    c.restore();
  }
  BB.length = 0;
}

/* 비율을 유지한 채 주어진 상자 안에 맞춰 그린다 (아래 정렬) */
function fitImg(c, im, cx, by, maxW, maxH) {
  const k = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  c.drawImage(im, cx - w / 2, by - h, w, h);
}

/* ================= 블록 모델 ================= */
/* 유닛 공간: 발끝 y=0, 키 ≈ 1.0, 정면 = +Z. [x,y,z, w,h,d, color, yaw] */
function dk(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) * k) | 0, g = Math.min(255, ((n >> 8) & 255) * k) | 0, b = Math.min(255, (n & 255) * k) | 0;
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const WEAP = {
  sword(P, a) {
    P.push([0.42, 0.30, 0.08, 0.07, 0.18, 0.07, '#5a3a22']);
    P.push([0.42, 0.42, 0.08, 0.28, 0.06, 0.09, a.accent]);
    P.push([0.42, 0.68, 0.08, 0.11, 0.48, 0.05, '#dce6f2']);
  },
  greatsword(P, a) {

    P.push([0.44, 0.80, 0.10, 0.16, 0.66, 0.06, '#e6eef8']);

  axe(P, a) {

  bow(P, a) {

    P.push([0.46, 0.28, -0.04, 0.05, 0.16, 0.06, '#8a5a2a']);

  staff(P, a) {

for (const k of ['slime', 'goblin', 'bat', 'skel', 'imp', 'ghost', 'golem', 'witch', 'dragon', 'zombie', 'spider', 'wolf', 'darkkn', 'succub', 'lich', 'demon', 'minotaur', 'gargoyle']) ART_IMG[k] = 'images/followers/' + k + '.png';

/* ================= 효과음 (Web Audio 합성, 음원 파일 없음) ================= */
const SFX = (() => {
  let ctx = null, master = null, nbuf = null;
  const last = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
    nbuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function env(node, t0, dur, peak) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    node.connect(g); g.connect(master);
  }
  function osc(f1, f2, dur, type, vol, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(); o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
      env(o, t0, dur, vol === undefined ? 0.2 : vol);
      o.start(t0); o.stop(t0 + dur + 0.06);
    }
  }
  function nz(dur, vol, lp, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const s = ctx.createBufferSource(); s.buffer = nbuf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 2200;
      s.connect(f); env(f, t0, dur, vol === undefined ? 0.2 : vol);
      s.start(t0); s.stop(t0 + dur + 0.06);
    }
  }
  /* 같은 소리가 한꺼번에 겹쳐 터지면 찢어지므로 짧게 묶어 막는다 */
  function gate(name, ms) {
    const n = performance.now();
    if (last[name] && n - last[name] < (ms || 38)) return false;
    last[name] = n; return true;
  }
  const SND = { slime:'squish', goblin:'blade', bat:'bite', skel:'bow', imp:'blunt', ghost:'dark', golem:'stone', witch:'dark', dragon:'breath',
    wolf:'bite', zombie:'blunt', spider:'bite', darkkn:'blade', succub:'magic', lich:'dark', demon:'stone',
    vagrant:'blade', trainee:'blade', looter:'blade', lancer:'blade', ranger:'bow', cleric:'magic', warlock:'magic', champion:'blade', paladin:'blunt',
    boss1:'blade', boss2:'blunt', boss3:'magic' };
  return {
    unlock: init,
    /* ---- 종류별 공격·피격 소리 ---- */
    atk(key, ranged) {
      const k = SND[key] || 'blade';
      if (!gate('atk' + k, 48)) return;
      switch (k) {
        case 'bow':    osc(330, 170, 0.09, 'triangle', 0.12); nz(0.08, 0.07, 4200, 0.01); break;           /* 활시위 + 화살 바람 */
        case 'magic':  osc(520, 1180, 0.14, 'sine', 0.1); osc(780, 1560, 0.12, 'sine', 0.05, 0.03); break;
        case 'dark':   osc(320, 140, 0.22, 'sawtooth', 0.07); osc(430, 860, 0.2, 'sine', 0.06, 0.02); break;
        case 'breath': nz(0.45, 0.2, 1700); osc(120, 70, 0.4, 'sawtooth', 0.12); break;

    const q = o.q, hp = q[5], hero = q[7], r = o.r, cx = o.x, cy = o.y;
    if (hp >= 0) {
      const bw = r * 2.5, bh = r * 0.6, bx = cx + r * 0.78, by = cy - bh / 2;
      ctx.fillStyle = 'rgba(8,5,14,.75)'; rbox(bx - 2, by - 2, bw + 4, bh + 4, bh * 0.7 + 2); ctx.fill();
      ctx.fillStyle = 'rgba(44,32,58,.95)'; rbox(bx, by, bw, bh, bh * 0.5); ctx.fill();
      const w2 = Math.max(bh, bw * Math.max(0, Math.min(1, hp)));
      ctx.fillStyle = hero ? '#e8574c' : '#5fd071'; rbox(bx, by, w2, bh, bh * 0.5); ctx.fill();
      ctx.fillStyle = hero ? 'rgba(255,176,166,.45)' : 'rgba(192,255,202,.45)';
      rbox(bx, by, w2, bh * 0.4, bh * 0.3); ctx.fill();

    ctx.globalAlpha = hero === 2 ? 0.8 : 1;
    ctx.fillStyle = 'rgba(12,8,20,.92)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = q[4]; ctx.lineWidth = Math.max(1.4, r * 0.17);
    ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth * 0.5, 0, 7); ctx.stroke();
    ctx.font = (r * 1.2) + 'px sans-serif';
    ctx.fillText(q[0], cx, cy + r * 0.06);
    ctx.globalAlpha = 1;
  }
}

/* ================= 전투 3D ================= */
const ZONE_X0 = 50, ZONE_X1 = 310, ZONE_W = ZONE_X1 - ZONE_X0;
/* 정지 그림 한 장으로 생동감을 만드는 자세 계산.
   숨쉬기 / 걷기 통통 / 공격 준비-내지름 / 피격 떨림·납작 / 등장 */
function pose(u, baseY) {
  const atk = u.atk > 0 ? u.atk : 0, hit = u.hitT > 0 ? u.hitT : 0;
  const walk = u.moving > 0 ? u.moving : 0, sp = u.spawnT > 0 ? u.spawnT : 0;
  const t = T + (u.bobOff || 0);
  const idle = Math.sin(t * 2.3) * 1.3;
  const step = walk * Math.abs(Math.sin(t * 9.5)) * 5;
  /* 준비(천천히 뒤로) → 가격(순간적으로 앞으로) → 복귀(부드럽게) */
  let push = 0, tilt = 0;
  if (atk > 0) {
    const pr = 1 - atk;
    if (pr < 0.30) { const k = pr / 0.30, e = 1 - Math.pow(1 - k, 3); push = -7 * e; tilt = 0.17 * e; }
    else if (pr < 0.46) { const k = (pr - 0.30) / 0.16, e = k * k; push = -7 + 26 * e; tilt = 0.17 - 0.45 * e; }
    else { const k = (pr - 0.46) / 0.54, e = 1 - Math.pow(1 - k, 3); push = 19 * (1 - e); tilt = -0.28 * (1 - e); }
  }
  tilt += walk * Math.sin(t * 9.5) * 0.05;
  const shk = hit > 0 ? (Math.random() - 0.5) * 6 * hit : 0;
  const sx = (1 + walk * 0.04 - hit * 0.12 + atk * 0.04) * (1 - sp * 0.35);
  const sy = (1 - walk * 0.05 + hit * 0.14 - atk * 0.03) * (1 - sp * 0.35);
  return { y:baseY + idle + step + sp * 30, push, shk, kx:u.kbx || 0, kz:u.kbz || 0,
           o:{ tilt, sx, sy, flash:hit, alpha:1 - sp * 0.7, flip:Math.sin((u.yaw || 0) + cam.yaw) < 0 } };
}

function drawScene() {
  cam.dist -= camPunch;
  const sk = shake > 0 ? shake : 0;
  const ox = sk ? (Math.random() - 0.5) * sk : 0, oy = sk ? (Math.random() - 0.5) * sk : 0;
  beginScene(ctx, cam, VCX + ox, vcyNow() + oy, fovNow());

  /* 바닥 — 큰 판 하나면 깊이 정렬이 깨지므로 타일로 쪼갠다 */
  for (let gx = -1; gx < 7; gx++) for (let gz = 0; gz < 10; gz++) {
    pushBox(10 + 60 * gx + 30, -20, Z_START - 60 + 80 * gz + 40, 60, 20, 80, ((gx + gz) & 1) ? MAPK.tile[0] : MAPK.tile[1]);
  }
  /* 길: 비스듬한 구간은 회전한 판을 이어 붙인다 */
  /* 길마다 색이 달라서 갈래가 한눈에 구분된다: A 붉은색, B 푸른색, C 초록색, 교차로 보라색 */
  const mixc = (a, b, t) => { const p = parseInt(a.slice(1), 16), q = parseInt(b.slice(1), 16);
    const f = (sh) => Math.round(((p >> sh) & 255) * (1 - t) + ((q >> sh) & 255) * t);
    return '#' + ((1 << 24) + (f(16) << 16) + (f(8) << 8) + f(0)).toString(16).slice(1); };
  const roadSeg = (x1, z1, x2, z2, w, n, zc) => {
    const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz), yaw = Math.atan2(dx, dz), cc = ZCOL[zc === undefined ? 3 : zc][1];
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      pushBox(x1 + dx * t, -4, z1 + dz * t, w, 10, L / n - 1.5, mixc((i & 1) ? MAPK.road[0] : MAPK.road[1], cc, (i & 1) ? 0.20 : 0.15), yaw);
      /* 길 가장자리 띠 */
      const nx = Math.cos(yaw), nz = -Math.sin(yaw);
      for (const sd of [-1, 1]) pushBox(x1 + dx * t + nx * (w / 2 - 2) * sd, 2, z1 + dz * t + nz * (w / 2 - 2) * sd, 4, 4, L / n - 1.5, mixc(MAPK.road[1], cc, 0.75), yaw);
    }
  };
  for (let r = 0; r < 3; r++) {
    const rx = ROAD_X[r], pp = ROADS[r].pts, last = pp.length - 2;
    for (let i = 0; i < last; i++) {
      const L0 = Math.hypot(pp[i + 1][0] - pp[i][0], pp[i + 1][1] - pp[i][1]);
      roadSeg(pp[i][0], i === 0 ? pp[i][1] + 10 : pp[i][1], pp[i + 1][0], pp[i + 1][1], (i === 0 || i === last - 1) ? 58 : 74, Math.max(3, Math.ceil(L0 / 36)), r);
    }
    /* 길목 기둥과 횃불 */
    for (const sx of [-1, 1]) for (const pz of [FORK_Z + 4, MERGE_Z - 4]) {
      const px = rx + sx * 46;
      pushBox(px, 18, pz, 14, 40, 14, '#241d38');
      const g = 0.6 + Math.sin(T * 4 + px + pz) * 0.3;
      pushBox(px, 42, pz, 9, 10, 9, dk(ZCOL[r][1], 0.7 + g * 0.5));
    }
  }
  roadSeg(180, JOIN_Z, 180, Z_END, 90, 6, 3);
  /* 관문 장식 */
  for (const q of G.decor) pushBox(q[0], q[1], q[2], q[3], q[4], q[5], q[6], q[7]);
  /* 지형 */
  for (const f of G.feats) {
    const g = 0.6 + Math.sin(T * 3 + f.z) * 0.3;
    if (f.t === 'choke') for (const sd of [-1, 1]) pushBox(f.x + sd * 26, 10, f.z, 16, 32, FEAT_R * 2, '#2e2640');
    else if (f.t === 'swamp') { pushBox(f.x, 1.6, f.z, f.road === 3 ? 110 : 66, 1, FEAT_R * 2, '#203a24'); pushBox(f.x - 10, 2.4, f.z + 6, 6, 1, 6, dk('#4a8a4a', 0.6 + g * 0.3)); }
    else if (f.t === 'altar') { const ax = f.x + (f.road === 3 ? 62 : 46); pushBox(ax, -2, f.z, 18, 16, 18, '#2a2234'); pushBox(ax, 8, f.z, 10, 4, 10, dk(FEAT.altar.col, 0.6 + g * 0.5)); }
  }
  /* 거점 발판 */
  for (const o of OUTPOSTS) {
    if (o.road < 3) pushBox(o.x, 0, o.z, 66, 8, 84, '#372d50');
    else pushBox(o.x, 0, o.z, 168, 8, 100, '#372d50');
  }
  /* 입구 */
  pushBox(140, 24, Z_START, 14, 48, 14, '#5a4330');
  pushBox(220, 24, Z_START, 14, 48, 14, '#5a4330');
  pushBox(180, 52, Z_START, 94, 10, 14, '#6b5038');

  /* 배치 칸 */
  for (let i = 0; i < NROOM; i++) {
    const r = ROOMS[i], b = G.rooms[i];
    const col = i === G.sel ? '#7a6630' : (G.moveFrom >= 0 && !b) ? '#2f5f3f' : b ? '#2a2440' : r.trapOnly ? '#5a2e36' : '#473c66';
    pushBox(r.x, 3, r.z, 30, 7, 30, col);
  }

  pushBox(STONE.x, 2, STONE.z, 76, 12, 76, '#2a2242');
  const si = cam.pitch > 1.25 ? null : unitImg('__stone');
  if (!si) drawModel(CRYSTAL(), STONE.x, 8, STONE.z, 46, 0);
  const bbQ = [], simple = cam.pitch > 1.25, icoQ = [], plQ = [];
  for (let i = 0; i < G.rooms.length; i++) {
    const b = G.rooms[i]; if (!b) continue;
    if (b.def.kind === 'minion') {
      const fly = b.def.fly ? 14 + Math.sin(T * 3 + i) * 4 : 0;
      const P = pose(b, 9 + fly);
      const bx = b.x + Math.sin(b.yaw) * P.push + P.shk + P.kx, bz = b.z + Math.cos(b.yaw) * P.push + P.kz;
      if (simple) { icoQ.push([b.def.ico, b.x, b.z, RAR_COL[b.def.rar], b.hp / b.maxHp]); }
      else {
        const im = unitImg(b.key);
        plQ.push([b.def.ico, bx, P.y, bz, RAR_COL[b.def.rar], b.hp / b.maxHp, b.def.sc * 1.55, 0]);
        if (im) bbQ.push([im, bx, P.y, bz, b.def.sc * 1.55, P.o, 2]);
        else drawModel(modelOf(b.key, b.def.art), bx, P.y, bz, b.def.sc, b.yaw);
      }
    } else if (simple) { icoQ.push([b.def.ico, b.x, b.z, RAR_COL[b.def.rar], -1]); }
    else if (b.spent) {
      plQ.push(['💨', b.x, 9, b.z, '#5a5068', -1, b.def.sc * 0.5, 2]);
    } else {
      const im = unitImg(b.key);
      if (im) bbQ.push([im, b.x, 9, b.z, b.def.sc * 0.9, NOOPT, 2]);
      else drawModel(TRAPM[b.key](), b.x, 9, b.z, b.def.sc, 0);
      plQ.push([b.def.ico, b.x, 9, b.z, RAR_COL[b.def.rar], -1, b.def.sc * 0.9, 2]);
    }
  }
  for (const h of G.heroes) {
    const P = pose(h, 9);
    const hx = h.x + Math.sin(h.yaw) * P.push + P.shk + P.kx, hz = h.z + Math.cos(h.yaw) * P.push + P.kz;
    const im = unitImg(h.type);
    const hsz = h.def.sc * (h.scl || 1);
    if (simple) icoQ.push([h.def.ico, h.x, h.z, gradeCol(h.def), h.hp / h.maxHp, 1]);
    else {
      if (im) bbQ.push([im, hx, P.y, hz, hsz * 1.55, P.o, 2]);
      else drawModel(modelOf(h.type, h.def.art), hx, P.y, hz, hsz, h.yaw);
      plQ.push([h.def.ico, hx, P.y, hz, gradeCol(h.def), h.hp / h.maxHp, hsz * 1.55, 1]);
    }
  }
  /* 쓰러진 유닛: 옆으로 넘어지며 사라진다 */
  for (const c of G.corpses) {
    const im = unitImg(c.key); if (!im) continue;
    const k = 1 - c.t;
    bbQ.push([im, c.x, 9, c.z, c.def.sc * 1.55,
      { tilt:c.dir * 1.45 * Math.min(1, k * 1.8), alpha:Math.min(1, c.t * 1.6),
        sx:1 + k * 0.1, sy:1 - k * 0.15, flash:Math.max(0, 1 - k * 4), shadow:false,
        flip:Math.sin((c.yaw || 0) + cam.yaw) < 0 }, 2]);
  }
  for (const m of G.meteors) {
    pushBox(m.x, m.y + 14, m.z, 24, 24, 24, '#ff7a2a');
    pushBox(m.x, m.y + 36, m.z, 14, 20, 14, '#ffd35a');
  }
  endScene();
  if (si) pushBillboard(si, STONE.x, 10 + Math.sin(T * 1.6) * 2, STONE.z, 56, { sy:1 + Math.sin(T * 1.6) * 0.02 }, 2);
  for (const q of bbQ) pushBillboard(q[0], q[1], q[2], q[3], q[4], q[5], q[6]);
  drawBillboards();
  /* 위에서 내려다보는 배치 시점에서는 일러스트 대신 알아보기 쉬운 아이콘 */
  for (const q of icoQ) {
    const s2 = proj(q[1], 14, q[2]); if (!s2) continue;
    const r = 15 * (540 / s2[2]) * 1.3;
    ctx.fillStyle = 'rgba(14,10,22,.85)'; ctx.beginPath(); ctx.arc(s2[0], s2[1], r, 0, 7); ctx.fill();
    ctx.strokeStyle = q[3]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s2[0], s2[1], r, 0, 7); ctx.stroke();
    ctx.font = (r * 1.25) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(q[0], s2[0], s2[1] + r * 0.06);
    if (q[4] >= 0) bar2(s2[0] - r, s2[1] + r + 2, r * 2, 3.5, q[4], q[5] ? '#e8574c' : '#6bdc7a');
  }
  drawPlates(plQ);

  /* --- 3D 위에 겹치는 2D 표시 --- */
  /* 방어 라인: 반투명 띠 + 점선 */
  {
    const pts = [];
    for (let x = 14; x <= 346; x += 12) { const p = proj(x, 2, G.defLine); if (p) pts.push(p); }
    if (pts.length > 1) {
      ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(T * 3) * 0.1;
      ctx.strokeStyle = '#ff5a6a'; ctx.lineWidth = 6; ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      ctx.globalAlpha = 0.9; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
      const lp = pts[pts.length - 1];
      ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#ff9aa4';
      ctx.fillText('방어 라인', Math.min(W - 4, lp[0]), lp[1] - 3);
      ctx.restore();
    }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 지형 · 함정 전용 칸 이름 */
  for (const f of G.feats) {
    const p0 = proj(f.x, 4, f.z + FEAT_R + 6); if (!p0) continue;
    ctx.font = 'bold ' + Math.max(7, Math.min(10, 8 * (540 / p0[2]) * 1.2)) + 'px sans-serif'; ctx.fillStyle = FEAT[f.t].lab;
    ctx.fillText(FEAT[f.t].name, p0[0], p0[1]);
  }
  for (const R of ROOMS) if (R.trapOnly) {
    const p0 = proj(R.x, 4, R.z + 22); if (!p0) continue;
    ctx.font = Math.max(7, Math.min(10, 8 * (540 / p0[2]) * 1.2)) + 'px sans-serif'; ctx.fillStyle = '#e8a0a8'; ctx.fillText('함정칸', p0[0], p0[1]);
  }
  for (const o of OUTPOSTS) {
    const p0 = proj(o.x, 4, o.z + (o.road < 3 ? 44 : 60)); if (!p0) continue;
    const fs = Math.max(7, Math.min(11, 9 * (540 / p0[2]) * 1.2));
    ctx.font = fs + 'px sans-serif'; ctx.fillStyle = 'rgba(160,140,200,.8)'; ctx.fillText(o.name, p0[0], p0[1]);
  }
  /* 교전 중인 자리: 붉은 원 */
  for (const P of G.parties) if (P.fight) {
    let sx2 = 0, sz2 = 0, n2 = 0;
    for (const h of P.heroes) if (h.fighting) { sx2 += h.x; sz2 += h.z; n2++; }
    if (n2) ground3(sx2 / n2, sz2 / n2, 62 + Math.sin(T * 6) * 4, 'rgba(255,90,90,.5)', 2);
  }
  if (G.sel >= 0) {
    ground3(ROOMS[G.sel].x, ROOMS[G.sel].z, 30, '#ffd35a', 2);
    const b = G.rooms[G.sel]; if (b) ground3(b.x, b.z, b.def.rng, 'rgba(255,211,90,.45)', 1.5);
  }
  if (G.moveFrom >= 0) for (let i = 0; i < NROOM; i++) if (!G.rooms[i]) ground3(ROOMS[i].x, ROOMS[i].z, 28, '#6bdc7a', 2);
  if (G.frenzy > 0) for (const b of G.rooms) if (b && b.def.kind === 'minion') ground3(b.x, b.z, 24, 'rgba(255,90,90,.7)', 2, 14);
  for (const b of G.rooms) if (b && b.def.kind === 'minion') {
    if (b.guardT > 0) ground3(b.x, b.z, 26 + Math.sin(T * 6) * 2, 'rgba(139,233,255,.85)', 2.5);
    if (b.invT > 0) ground3(b.x, b.z, 28, 'rgba(200,200,214,.9)', 3);
  }
  for (const h of G.heroes) if (h.charmT > 0) ground3(h.x, h.z, 22, 'rgba(255,122,200,.8)', 2);
  for (const f of G.fx) {
    const a = f.life / f.max;
    if (f.k === 'ring') ground3(f.x, f.z, (1 - a) * f.r, f.col, 3 * a + 1);
    else if (f.k === 'slash') {
      const p = proj(f.x, 20, f.z); if (!p) continue;
      const sc2 = 540 / p[2], prog = 1 - a;
      ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(f.a);
      for (let g = 0; g < 3; g++) {
        const gp = Math.max(0, prog - g * 0.13);
        ctx.globalAlpha = a * (1 - g * 0.32) * 0.95;
        ctx.strokeStyle = f.col; ctx.lineWidth = (3.6 - g) * sc2 * 0.9 + 0.6;
        ctx.beginPath(); ctx.arc(0, 0, (9 + gp * 26) * sc2, -1.15 + gp * 1.7, -0.35 + gp * 1.7); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  for (const b of G.bolts) {
    const p = proj(b.x, 20, b.z); if (!p) continue;
    const q = proj(b.x - (b.x2 - b.x1) * 0.14, 20, b.z - (b.z2 - b.z1) * 0.14);
    if (q) { ctx.globalAlpha = 0.6; ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(p[0], p[1], 2.4 * (540 / p[2]) + 1.2, 0, 7); ctx.fill();
  }
  for (const p of G.parts) {
    const s = proj(p.x, p.y, p.z); if (!s) continue;
    ctx.globalAlpha = Math.min(1, p.life / 0.4); ctx.fillStyle = p.col;
    const r = p.sz * (540 / s[2]); ctx.beginPath(); ctx.arc(s[0], s[1], Math.max(0.6, r), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < G.rooms.length; i++) {
    const b = G.rooms[i];
    if (!b) {
      if (i >= NROOM) continue;
      const s = proj(ROOMS[i].x, 10, ROOMS[i].z); if (!s) continue;
      const rv = G.revive.find(v => v.i === i);
      if (rv) {
        ctx.globalAlpha = 0.55;
        txt('쓰러짐', s[0], s[1] - 4, 10, '#8a7aa5', 'center');
        ctx.globalAlpha = 1;
      } else if (G.phase === 'prep') txt('+', s[0], s[1], 15, '#7b6a95', 'center');
    }
    else if (b.def.kind === 'minion') {
      const s = proj(b.x, b.def.sc * (unitImg(b.key) ? 1.62 : 1.3), b.z); if (!s) continue;
      const w = 30 * (540 / s[2]) * 1.2; bar2(s[0] - w / 2, s[1] - 4, w, 4, b.hp / b.maxHp, '#6bdc7a');
    }
  }
  for (const h of G.heroes) {
    const s = proj(h.x, h.def.sc * (h.scl || 1) * (unitImg(h.type) ? 1.62 : 1.25), h.z); if (!s) continue;
    const w = (h.def.tier === 'hero' ? 42 : 28) * (540 / s[2]) * 1.2;
    const col = gradeCol(h.def);
    ctx.fillStyle = col; ctx.fillRect(s[0] - w / 2 - 2.5, s[1] - 5, 2.5, 6);
    bar2(s[0] - w / 2, s[1] - 5, w, 4.5, h.hp / h.maxHp, h.slow > 0 ? '#78b6ff' : '#ff6b6b');
    /* 이름표: 중간보스·용사는 이름, 접두 능력은 그 위에 */
    const gd = GRADE_OF[h.type];
    if (gd) txt(h.def.name, s[0], s[1] - 13, 9, col, 'center');
    if (h.A) txt(h.A.name, s[0], s[1] - (gd ? 24 : 13), 9, h.A.col, 'center');
    if (h.charmT > 0) txt('💗', s[0] + w / 2 + 6, s[1] - 2, 10, '#ff7ac8', 'center');
  }
  const st = proj(STONE.x, 72, STONE.z);
  if (st) bar2(st[0] - 40, st[1] - 10, 80, 7, G.stone / G.maxStone, '#8b5cf6');
  for (const f of G.fx) if (f.k === 'txt') {
    const a = f.life / f.max, s = proj(f.x, f.y + (1 - a) * 28, f.z);
    if (!s) continue;
    const grow = a > 0.78 ? 1 + (a - 0.78) * 2.6 : 1;
    ctx.globalAlpha = Math.min(1, a * 1.8);
    ctx.save(); ctx.translate(s[0], s[1]); ctx.scale(grow, grow);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText(f.txt, 0, 0); ctx.fillStyle = f.col; ctx.fillText(f.txt, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (G.seal > 0) { ctx.fillStyle = 'rgba(90,180,255,.12)'; ctx.fillRect(0, 0, W, PANEL_Y); }
  cam.dist += camPunch;
}

/* ================= 전투 UI ================= */
/* 웨이브 시작 전: 어느 길로 어떤 무리가 오는지 미리 보여 준다 (입구 쪽 빈 자리에 작게) */
function drawPreview() {
  if (G.phase !== 'prep' || !G.plan) return;
  for (let r = 0; r < 3; r++) {
    const P = G.plan.find(p => p.road === r);
    const q = proj(ROAD_X[r], 4, FORK_Z - 40); if (!q) continue;
    const cw = 58, cx = Math.max(cw / 2 + 3, Math.min(W - cw / 2 - 3, q[0]));
    const cnt = {}, order = [];
    if (P) for (const m of P.members) { const k = m.type + (m.af ? ':' + m.af : ''); if (!cnt[k]) { cnt[k] = 0; order.push(k); } cnt[k]++; }
    const rows = Math.max(1, Math.ceil(order.length / 2)), ch = 14 + rows * 12 + 3, y0 = 100;
    ctx.fillStyle = P ? 'rgba(70,22,32,.92)' : 'rgba(24,18,36,.72)'; rbox(cx - cw / 2, y0, cw, ch, 7); ctx.fill();
    ctx.strokeStyle = P ? ZCOL[r][1] : '#3a2f4d'; ctx.lineWidth = P ? 1.8 : 1; rbox(cx - cw / 2, y0, cw, ch, 7); ctx.stroke();
    txt(ROAD_NAME[r], cx, y0 + 7, 9, P ? ZCOL[r][1] : '#6b5a85', 'center');
    if (!P) { txt('조용함', cx, y0 + 21, 8, '#6b5a85', 'center'); continue; }
    order.forEach((k, i) => {
      const t = k.split(':')[0], af = k.split(':')[1];
      const col = i % 2, row = (i / 2) | 0;
      txt(DEF[t].ico + cnt[k] + (af ? AFFIX[af].name.charAt(0) : ''), cx - cw / 4 + col * (cw / 2) + (col ? 0 : 0), y0 + 21 + row * 12, 9,
          af ? AFFIX[af].col : '#fff', 'center');
    });
  }
}

function drawGame() {
  BTN = [];
  ctx.fillStyle = '#0b0712'; ctx.fillRect(0, 0, W, H);
  const sTop = STG.k > 0.01 ? STG.y0 + STG.h * STG.k : 0;
  ctx.save(); ctx.beginPath(); ctx.rect(0, sTop, W, PANEL_Y - sTop); ctx.clip();
  drawScene();
  ctx.restore();
  drawStage();

  /* 상단 HUD */
  ctx.fillStyle = 'rgba(8,6,14,.88)'; ctx.fillRect(0, 0, W, 38);
  const S = curStage();
  txt(G.endless ? '∞ 무한의 문' : '제' + S.no + '관문 · ' + S.name, 10, 12, 12, '#fff');
  txt((G.endless ? '웨이브 ' + (G.wIdx + 1) + (SAVE.endlessBest ? '  (최고 ' + SAVE.endlessBest + ')' : '')
                : '웨이브 ' + (G.wIdx + 1) + '/' + waveCount()) + '   ◆ +' + G.gems, 10, 28, 11, '#8be9ff');
  txt('수호석', 180, 12, 10, '#c9b8ff'); bar2(216, 8, 100, 9, G.stone / G.maxStone, '#8b5cf6');
  txt(Math.ceil(G.stone) + ' / ' + G.maxStone, 316, 28, 10, '#c9b8ff', 'right');
  if (G.phase === 'run' || G.phase === 'prep') btn(W - 36, 4, 30, 30, '⏸', pauseGame, { bg:'rgba(40,32,60,.9)', fs:14 });
  { const bh = G.heroes.find(h => h.boss); if (bh) { ctx.fillStyle = '#2a1608'; ctx.fillRect(0, 38, W, 4); ctx.fillStyle = '#ff9a4a'; ctx.fillRect(0, 38, W * Math.max(0, bh.hp / bh.maxHp), 4); } }
  if (G.frenzy > 0) txt('광기 ' + G.frenzy.toFixed(1) + 's', 150, 28, 10, '#ff6b6b');
  if (G.msgT > 0) { ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 42, W, 20); txt(G.msg, W / 2, 52, 11, '#ffe9a8', 'center'); }
  if (G.aim) { ctx.globalAlpha = 0.6 + Math.sin(T * 8) * 0.3; txt('운석을 떨어뜨릴 곳을 누르세요', 12, 76, 13, '#ffa94d'); ctx.globalAlpha = 1; }

  /* 시점 버튼 */
  /* 길 바로가기 */
  ['A길', 'B길', 'C길', '교차로'].forEach((nm, i) => {
    btn(6 + i * 35, 68, i === 3 ? 40 : 32, 22, nm, () => { camToView(i); STG.focus = i; },
        { bg:camMode === 'view' + i ? 'rgba(90,60,40,.9)' : 'rgba(40,32,60,.85)', fs:10, on:camMode === 'view' + i });
  });
  const manualCam = camManual || STG.focus >= 0;
  btn(154, 68, 64, 22, manualCam ? '카메라 수동' : '카메라 자동', () => {
    if (manualCam) { STG.focus = -1; camTo(G.phase === 'run' ? 'battle' : 'prep', 0.6); }

  ctx.fillStyle = r > 0.5 ? (s.hero ? '#e8574c' : '#6bdc7a') : r > 0.25 ? '#f2b84b' : '#ff4a4a'; ctx.fillRect(bx, byy, bw * r, 4);
  if (s.hero) {
    const gc = gradeCol(u.def); ctx.strokeStyle = gc; ctx.lineWidth = 1.2; ctx.strokeRect(bx - 1.5, byy - 1.5, bw + 3, 7);
    if (GRADE_OF[u.type]) { ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = gc; ctx.fillText(u.def.name, s.x + 5, byy - 17); }
  }
  ctx.font = '9px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText(ROLE_ICO[u.def.role] || '', bx - 3, byy + 2);

}
function drawStage() {
  const k = STG.k; if (k < 0.01) return;
  const y0 = STG.y0, hh = STG.h, vis = hh * k, z = STG.zone < 0 ? 0 : STG.zone, col = ZCOL[z];
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y0, W, vis); ctx.clip();
  ctx.translate((Math.random() - 0.5) * STG.shk, -(hh - vis) + (Math.random() - 0.5) * STG.shk);
  /* 배경 */
  const bg = stageBg(z), fg = stageFg(z);
  const o1 = -((STG.scroll * 0.25) % 360), o2 = -((STG.scroll * 0.7) % 360);
  ctx.drawImage(bg, o1, y0); ctx.drawImage(bg, o1 + 360, y0); ctx.drawImage(bg, o1 - 360, y0);
  ctx.globalAlpha = 0.9; ctx.drawImage(fg, o2, y0); ctx.drawImage(fg, o2 + 360, y0); ctx.drawImage(fg, o2 - 360, y0); ctx.globalAlpha = 1;
  /* 바닥 */
  const fy = y0 + hh - 66;
  const gr = ctx.createLinearGradient(0, fy, 0, y0 + hh); gr.addColorStop(0, col[0]); gr.addColorStop(0.15, '#1a1228'); gr.addColorStop(1, '#0a0610');
  ctx.fillStyle = gr; ctx.fillRect(0, fy, W, y0 + hh - fy);
  ctx.fillStyle = col[1] + '55'; ctx.fillRect(0, fy, W, 2);
  const sh = (STG.scroll * 1.0) % 60;
  for (let r = 0; r < 3; r++) {
    const ry = fy + 6 + r * 17, rh = 15, tw = 60 + r * 14, o = (STG.scroll * (1 + r * 0.25)) % tw;
    for (let i = -1; i < W / tw + 2; i++) {
      const tx = i * tw - o;
      ctx.fillStyle = ((i + r) & 1) ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.12)';
      ctx.fillRect(tx, ry, tw - 2, rh);
    }
  }
  void sh;
  /* 떠다니는 먼지 */
  ctx.fillStyle = col[1] + '55';
  for (let i = 0; i < 14; i++) {
    const px = ((i * 53 + T * (6 + i % 4) * 3 - STG.scroll * 0.4) % 380 + 380) % 380 - 10, py = y0 + 30 + ((i * 37) % 120) + Math.sin(T * 0.8 + i) * 6;
    ctx.fillRect(px, py, 2, 2);
  }
  /* 가운데 마주 선 선: 교전 거리 표시 */
  if (STG.nH && STG.nM) {
    ctx.save(); ctx.globalAlpha = 0.18; ctx.strokeStyle = '#fff'; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(W / 2, fy - 4); ctx.lineTo(W / 2, y0 + hh - 8); ctx.stroke(); ctx.restore();
  }
  /* 유닛: 뒷줄 먼저 */
  const list = [...STG.sp.values()].sort((a, b) => (b.row - a.row) || (a.by - b.by));
  for (const s of list) stageSprite(s);
  /* 쓰러지는 유닛 */
  for (const d of STG.dying) {
    const im = unitImg(d.key); if (!im) continue;
    const dir = d.hero ? 1 : -1, w = im.naturalWidth * (d.hpx / im.naturalHeight), e = d.t;
    ctx.save(); ctx.translate(d.x - dir * e * 18, d.by - e * 4); ctx.rotate(-dir * e * 1.3);
    ctx.globalAlpha = 1 - e;
    ctx.drawImage(im, -w / 2, -d.hpx, w, d.hpx);

    ctx.restore();

    const bx = b.sb.x, by = b.sb.by - (b.sb.hpx || 60) * 0.5, e = Math.min(1, b.t * 1.6);
    ctx.save(); ctx.globalAlpha = (1 - b.t) * 0.9; ctx.strokeStyle = '#9bffb4'; ctx.lineWidth = 2.2; ctx.shadowColor = '#7dff9b'; ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const f = i / 12 * e, px = ax + (bx - ax) * f, py = ay + (by - ay) * f - Math.sin(f * Math.PI) * 14 + Math.sin(f * 18 + T * 20) * 2;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);

  /* 투사체 */
  for (const p of STG.proj) {

    const dx = p.cx - (p.px || p.cx), dy = p.cy - (p.py || p.cy), dl = Math.hypot(dx, dy) || 1;
    ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.moveTo(p.cx - dx / dl * 14, p.cy - dy / dl * 14); ctx.lineTo(p.cx, p.cy); ctx.stroke();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(p.cx, p.cy, 3, 0, 7); ctx.fill(); ctx.restore();
  }
  /* 베기 / 충격 */
  for (const r of STG.rings) {
    const e = r.t; ctx.save(); ctx.globalAlpha = (1 - e) * 0.9; ctx.strokeStyle = r.col; ctx.lineWidth = 2.4;
    ctx.translate(r.x, r.y); ctx.rotate(r.dir * 0.6);
    ctx.beginPath(); ctx.moveTo(-14 * r.dir, -10 + e * 6); ctx.quadraticCurveTo(0, -2, 14 * r.dir, 10 - e * 6); ctx.stroke(); ctx.restore();
  }
  /* 불꽃 / 치유 입자 */
  for (const s of STG.spk) {
    const e = s.t / s.life; ctx.globalAlpha = 1 - e; ctx.fillStyle = s.col;
    if (s.plus) { ctx.fillRect(s.x - 3, s.y - 0.8, 6, 1.6); ctx.fillRect(s.x - 0.8, s.y - 3, 1.6, 6); }
    else ctx.fillRect(s.x, s.y, s.sz, s.sz);

    ctx.save(); ctx.globalAlpha = Math.min(1, STG.flashT * 1.6); ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(STG.trapName, W / 2, y0 + 70 - (1 - STG.flashT) * 12);
    ctx.fillStyle = STG.flashC; ctx.fillText(STG.trapName, W / 2, y0 + 70 - (1 - STG.flashT) * 12); ctx.restore();
  }
  /* 숫자 */
  for (const n of STG.nums) {
    const e = n.t / 0.95, y = n.y - e * 26 - Math.sin(Math.min(1, e * 4) * Math.PI) * 4;
    ctx.save(); ctx.globalAlpha = e < 0.6 ? 1 : 1 - (e - 0.6) / 0.4;
    ctx.font = 'bold ' + (n.size * (1 + Math.max(0, 0.3 - e) * 1.2)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(n.txt, n.x, y);
    ctx.fillStyle = n.col; ctx.fillText(n.txt, n.x, y); ctx.restore();

  if (STG.fade > 0) { ctx.globalAlpha = Math.min(1, STG.fade); ctx.fillStyle = '#000'; ctx.fillRect(0, y0, W, hh); ctx.globalAlpha = 1; }
  /* 못 담은 인원 */
  if (STG.overH) txt('+' + STG.overH, 12, y0 + hh - 16, 12, '#ff9a8a');
  if (STG.overM) txt('+' + STG.overM, W - 12, y0 + hh - 16, 12, '#9ae8b5', 'right');
  /* 보스 체력바 */
  for (const sp of STG.sp.values()) if (sp.u.boss) {
    const u = sp.u, bw = 190, bx = W / 2 - bw / 2, by = y0 + 30;
    ctx.fillStyle = 'rgba(8,6,14,.78)'; rbox(bx - 6, by - 11, bw + 12, 26, 8); ctx.fill();
    ctx.strokeStyle = '#ff9a4a'; ctx.lineWidth = 1.2; rbox(bx - 6, by - 11, bw + 12, 26, 8); ctx.stroke();
    ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffd9a0';
    ctx.fillText('👑 ' + u.def.name, W / 2, by - 3);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx, by + 4, bw, 6);
    ctx.fillStyle = '#ff9a4a'; ctx.fillRect(bx, by + 4, bw * Math.max(0, u.hp / u.maxHp), 6);

  const label = (STG.zone < 0 ? '' : ZNAME[z]) + (STG.nH || STG.nM ? '  침입자 ' + STG.nH + ' vs 권속 ' + STG.nM : '  침입자를 기다리는 중…');

  ctx.strokeStyle = col[1]; ctx.lineWidth = 1.2; rbox(6, y0 + 5, tw, 18, 9); ctx.stroke();

  ctx.font = '9px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = STG.focus >= 0 ? '#ffd35a' : '#8a7aa5';

/* 보스 그림 별칭: 새 그림이 오기 전까지 기존 용사 그림을 쓴다 */
ART_IMG.boss1 = ART_IMG.champion; ART_IMG.boss2 = ART_IMG.paladin; ART_IMG.boss3 = ART_IMG.warlock;
