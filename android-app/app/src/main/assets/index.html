<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>마왕의 던전</title>
<style>
html,body{margin:0;height:100%;background:#0b0712;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:absolute}
</style>
</head>
<body>
<canvas id="c" width="360" height="700"></canvas>
<script>
/* =========================================================
   마왕의 던전 - 프로토타입 v0.5
   - 자체 제작 3D 소프트 렌더러 (외부 라이브러리 없음)
   - 자유 카메라: 한 손가락 드래그 회전, 두 손가락 확대/축소
   - 유닛은 블록 조립 모델. MODEL 블록만 바꾸면 통째로 교체 가능
   - 관문(스테이지) 3개로 분할, 순차 해금
   ========================================================= */
const W = 360, H = 700, PANEL_Y = 516;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();
let T = 0, shake = 0;

/* ================= 3D 소프트 렌더러 ================= */
const LIGHT = (() => { const l = [0.42, 0.86, 0.3], m = Math.hypot(l[0], l[1], l[2]); return [l[0]/m, l[1]/m, l[2]/m]; })();
const CORN = [];
for (let i = 0; i < 8; i++) CORN.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
const FACES = [
  [4,5,7,6, 0,0,1], [1,0,2,3, 0,0,-1],
  [5,1,3,7, 1,0,0], [0,4,6,2, -1,0,0],
  [6,7,3,2, 0,1,0], [0,1,5,4, 0,-1,0],
];
const RT = { ctx:null, cam:null, cx:0, cy:0, fov:420, faces:[], n:0 };
const _vx = new Float32Array(8), _vy = new Float32Array(8), _vz = new Float32Array(8);
const _sx = new Float32Array(8), _sy = new Float32Array(8);

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) * k, g = ((n >> 8) & 255) * k, b = (n & 255) * k;
  r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function beginScene(c, cam, cx, cy, fov) { RT.ctx = c; RT.cam = cam; RT.cx = cx; RT.cy = cy; RT.fov = fov; RT.n = 0; }
function pushBox(px, py, pz, sw, sh, sd, col, yaw) {
  const cam = RT.cam;
  const cq = Math.cos(yaw || 0), sq = Math.sin(yaw || 0);
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const hw = sw / 2, hh = sh / 2, hd = sd / 2;
  for (let i = 0; i < 8; i++) {
    const o = CORN[i];
    const lx = o[0] * hw, ly = o[1] * hh, lz = o[2] * hd;
    const wx = px + lx * cq + lz * sq, wy = py + ly, wz = pz - lx * sq + lz * cq;
    const dx = wx - cam.tx, dy = wy - cam.ty, dz = wz - cam.tz;
    const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
    const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
    _vx[i] = x1; _vy[i] = vy; _vz[i] = vz;
    if (vz > 1) { const f = RT.fov / vz; _sx[i] = RT.cx + x1 * f; _sy[i] = RT.cy - vy * f; }
    else { _sx[i] = NaN; _sy[i] = NaN; }
  }
  for (let fi = 0; fi < 6; fi++) {
    const F = FACES[fi];
    const a = F[0], b = F[1], c2 = F[2], d2 = F[3];
    if (_vz[a] <= 1 || _vz[b] <= 1 || _vz[c2] <= 1 || _vz[d2] <= 1) continue;
    const nx0 = F[4], ny0 = F[5], nz0 = F[6];
    const wnx = nx0 * cq + nz0 * sq, wny = ny0, wnz = -nx0 * sq + nz0 * cq;
    const rx = wnx * cy1 + wnz * sy1, rz1 = -wnx * sy1 + wnz * cy1;
    const ry = wny * cp + rz1 * sp, rz = -wny * sp + rz1 * cp;
    const ccx = (_vx[a] + _vx[b] + _vx[c2] + _vx[d2]) * 0.25;
    const ccy = (_vy[a] + _vy[b] + _vy[c2] + _vy[d2]) * 0.25;
    const ccz = (_vz[a] + _vz[b] + _vz[c2] + _vz[d2]) * 0.25;
    if (rx * ccx + ry * ccy + rz * ccz >= 0) continue;
    const dot = wnx * LIGHT[0] + wny * LIGHT[1] + wnz * LIGHT[2];
    const k = 0.52 + 0.48 * (dot > 0 ? dot : 0) + (wny > 0.9 ? 0.08 : 0);
    const o = RT.faces[RT.n] || (RT.faces[RT.n] = { p:new Float32Array(8), z:0, c:'' });
    o.p[0] = _sx[a]; o.p[1] = _sy[a]; o.p[2] = _sx[b]; o.p[3] = _sy[b];
    o.p[4] = _sx[c2]; o.p[5] = _sy[c2]; o.p[6] = _sx[d2]; o.p[7] = _sy[d2];
    o.z = ccz; o.c = shade(col, k); RT.n++;
  }
}
function endScene() {
  const arr = RT.faces.slice(0, RT.n);
  arr.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (let i = 0; i < arr.length; i++) {
    const o = arr[i], p = o.p;
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[2], p[3]); c.lineTo(p[4], p[5]); c.lineTo(p[6], p[7]); c.closePath();
    c.fillStyle = o.c; c.fill();
  }
}
function proj(x, y, z, cam) {
  cam = cam || RT.cam;
  const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz;
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  const x1 = dx * cy1 + dz * sy1, z1 = -dx * sy1 + dz * cy1;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const vy = dy * cp + z1 * sp, vz = -dy * sp + z1 * cp + cam.dist;
  if (vz <= 1) return null;
  const f = RT.fov / vz;
  return [RT.cx + x1 * f, RT.cy - vy * f, vz];
}
function ground3(cx, cz, r, col, lw, seg) {
  seg = seg || 28; const c = RT.ctx; c.beginPath();
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * Math.PI * 2, p = proj(cx + Math.cos(a) * r, 1, cz + Math.sin(a) * r);
    if (!p) return; i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]);
  }
  c.closePath(); c.strokeStyle = col; c.lineWidth = lw || 2; c.stroke();
}

/* ================= 일러스트(빌보드) ================= */
/* ART_IMG에 키별로 이미지 data URI를 넣으면 블록 모델 대신 그 그림을 세워서 그린다.
   비어 있으면 기존 블록 모델이 그대로 쓰인다. */
const ART_IMG = {};
const _IMG = {};
function unitImg(key) {
  const src = ART_IMG[key]; if (!src) return null;
  let im = _IMG[key];
  if (!im) { im = _IMG[key] = new Image(); im.src = src; }
  return im.complete && im.naturalWidth ? im : null;
}
/* 피격 섬광용 흰색 실루엣을 한 번만 만들어 캐시 */
const _WH = new Map();
function whiteOf(im) {
  if (_WH.has(im)) return _WH.get(im);
  let w = null;
  try {
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    w = c;
  } catch (e) { w = null; }
  _WH.set(im, w); return w;
}
const BB = [], NOOPT = {};
/* o = { flip, tilt, sx, sy, alpha, flash, shadow } */
function pushBillboard(im, x, y, z, h, o, groundY) {
  const p = proj(x, y, z); if (!p) return;
  let g = null;
  if (groundY !== undefined) { const q = proj(x, groundY, z); if (q) g = q; }
  BB.push({ x:p[0], y:p[1], z:p[2], im, h:h * (RT.fov / p[2]), o:o || NOOPT, g, k:RT.fov / p[2] });
}
function drawBillboards() {
  if (!BB.length) return;
  BB.sort((a, b) => b.z - a.z);
  const c = RT.ctx;
  for (const b of BB) {
    const o = b.o;
    const base = b.h / b.im.naturalHeight;
    const w = b.im.naturalWidth * base * (o.sx || 1), h = b.h * (o.sy || 1);
    if (b.g && o.shadow !== false) {
      c.save(); c.globalAlpha = 0.34 * (o.alpha === undefined ? 1 : o.alpha);
      c.fillStyle = '#000'; c.beginPath();
      c.ellipse(b.g[0], b.g[1], w * 0.3, w * 0.11, 0, 0, 7); c.fill(); c.restore();
    }
    c.save();
    c.translate(b.x, b.y);
    if (o.tilt) c.rotate(o.tilt);
    if (o.alpha !== undefined) c.globalAlpha = o.alpha;
    if (o.flip) c.scale(-1, 1);
    c.drawImage(b.im, -w / 2, -h, w, h);
    if (o.flash > 0) {
      const wi = whiteOf(b.im);
      if (wi) { c.globalAlpha = (o.alpha === undefined ? 1 : o.alpha) * Math.min(1, o.flash); c.drawImage(wi, -w / 2, -h, w, h); }
    }
    c.restore();
  }
  BB.length = 0;
}

/* 비율을 유지한 채 주어진 상자 안에 맞춰 그린다 (아래 정렬) */
function fitImg(c, im, cx, by, maxW, maxH) {
  const k = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight);
  const w = im.naturalWidth * k, h = im.naturalHeight * k;
  c.drawImage(im, cx - w / 2, by - h, w, h);
}

/* ================= 블록 모델 ================= */
/* 유닛 공간: 발끝 y=0, 키 ≈ 1.0, 정면 = +Z. [x,y,z, w,h,d, color, yaw] */
function dk(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16) * k) | 0, g = Math.min(255, ((n >> 8) & 255) * k) | 0, b = Math.min(255, (n & 255) * k) | 0;
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const WEAP = {
  sword(P, a) {
    P.push([0.42, 0.30, 0.08, 0.07, 0.18, 0.07, '#5a3a22']);
    P.push([0.42, 0.42, 0.08, 0.28, 0.06, 0.09, a.accent]);
    P.push([0.42, 0.68, 0.08, 0.11, 0.48, 0.05, '#dce6f2']);
  },
  greatsword(P, a) {
    P.push([0.44, 0.28, 0.10, 0.08, 0.22, 0.08, '#4a2e1a']);
    P.push([0.44, 0.44, 0.10, 0.36, 0.07, 0.10, a.accent]);
    P.push([0.44, 0.80, 0.10, 0.16, 0.66, 0.06, '#e6eef8']);
  },
  axe(P, a) {
    P.push([0.42, 0.44, 0.08, 0.07, 0.64, 0.07, '#5a3a22']);
    P.push([0.42, 0.74, 0.24, 0.11, 0.28, 0.32, '#cfd8e4']);
    P.push([0.42, 0.74, 0.04, 0.09, 0.18, 0.12, a.accent]);
  },
  spear(P, a) {
    P.push([0.42, 0.52, 0.08, 0.06, 0.98, 0.06, '#6b4a2a']);
    P.push([0.42, 1.06, 0.08, 0.10, 0.20, 0.07, '#dce6f2']);
  },
  bow(P, a) {
    P.push([0.46, 0.52, 0.04, 0.06, 0.40, 0.06, '#8a5a2a']);
    P.push([0.46, 0.76, -0.04, 0.05, 0.16, 0.06, '#8a5a2a']);
    P.push([0.46, 0.28, -0.04, 0.05, 0.16, 0.06, '#8a5a2a']);
    P.push([0.46, 0.52, 0.10, 0.02, 0.60, 0.02, '#f0f0f0']);
  },
  staff(P, a) {
    P.push([0.42, 0.52, 0.08, 0.06, 0.94, 0.06, '#4a3356']);
    P.push([0.42, 1.02, 0.08, 0.17, 0.17, 0.17, a.glow || '#9ad8ff']);
  },
  dagger(P, a) {
    P.push([0.40, 0.26, 0.10, 0.06, 0.12, 0.06, '#4a3a2a']);
    P.push([0.40, 0.42, 0.10, 0.07, 0.24, 0.04, '#dce6f2']);
  },
  club(P, a) {
    P.push([0.42, 0.40, 0.08, 0.08, 0.5, 0.08, '#5a3a22']);
    P.push([0.42, 0.72, 0.08, 0.24, 0.28, 0.24, a.accent]);
  },
};
const BUILD = {
  /* 우람한 인간형: 넓은 어깨, 두꺼운 가슴, 작은 머리 */
  burly(a) {
    const P = [], b = a.body, ac = a.accent, skin = a.skin || '#e0a87e', d = dk(b, 0.62);
    P.push([-0.15, 0.18, 0, 0.22, 0.36, 0.25, d]);
    P.push([ 0.15, 0.18, 0, 0.22, 0.36, 0.25, d]);
    P.push([-0.15, 0.05, 0.05, 0.25, 0.11, 0.33, dk(ac, 0.65)]);
    P.push([ 0.15, 0.05, 0.05, 0.25, 0.11, 0.33, dk(ac, 0.65)]);
    if (a.cape) P.push([0, 0.50, -0.22, 0.52, 0.58, 0.05, a.cape]);
    P.push([0, 0.37, 0, 0.44, 0.13, 0.31, ac]);
    P.push([0, 0.57, 0, 0.58, 0.32, 0.36, b]);
    P.push([0, 0.58, 0.19, 0.32, 0.22, 0.04, dk(ac, 1.12)]);
    P.push([-0.38, 0.68, 0, 0.24, 0.22, 0.38, ac]);
    P.push([ 0.38, 0.68, 0, 0.24, 0.22, 0.38, ac]);
    P.push([-0.38, 0.46, 0, 0.19, 0.32, 0.22, b]);
    P.push([ 0.38, 0.46, 0, 0.19, 0.32, 0.22, b]);
    P.push([-0.38, 0.27, 0.02, 0.21, 0.13, 0.23, skin]);
    P.push([ 0.38, 0.27, 0.02, 0.21, 0.13, 0.23, skin]);
    P.push([0, 0.75, 0, 0.19, 0.09, 0.19, dk(skin, 0.8)]);
    P.push([0, 0.86, 0, 0.31, 0.27, 0.31, skin]);
    P.push([-0.08, 0.88, 0.17, 0.07, 0.06, 0.03, a.eyes || '#1a1420']);
    P.push([ 0.08, 0.88, 0.17, 0.07, 0.06, 0.03, a.eyes || '#1a1420']);
    if (a.hood) {
      P.push([0, 0.90, -0.03, 0.38, 0.32, 0.36, ac]);
      P.push([0, 0.86, 0.16, 0.26, 0.18, 0.04, '#120c18']);
      P.push([-0.06, 0.88, 0.165, 0.06, 0.05, 0.03, a.eyes || '#ff6b6b']);
      P.push([ 0.06, 0.88, 0.165, 0.06, 0.05, 0.03, a.eyes || '#ff6b6b']);
    }
    if (a.helm) {
      P.push([0, 0.94, 0, 0.35, 0.18, 0.35, ac]);
      P.push([0, 0.86, 0.17, 0.28, 0.09, 0.04, dk(ac, 0.55)]);
      P.push([0, 1.05, -0.02, 0.08, 0.14, 0.3, a.crest || dk(ac, 1.25)]);
    }
    if (a.horns) {
      P.push([-0.17, 1.02, 0, 0.09, 0.22, 0.09, a.horn || '#ece4d4']);
      P.push([ 0.17, 1.02, 0, 0.09, 0.22, 0.09, a.horn || '#ece4d4']);
      P.push([-0.19, 1.15, 0, 0.07, 0.12, 0.07, a.horn || '#ece4d4']);
      P.push([ 0.19, 1.15, 0, 0.07, 0.12, 0.07, a.horn || '#ece4d4']);

  },
  blob(a) {
    const P = [], b = a.body;

    P.push([0, 0.58, 0, 0.5, 0.2, 0.46, dk(b, 1.16)]);
    P.push([0, 0.72, 0, 0.26, 0.12, 0.24, dk(b, 1.24)]);
    P.push([-0.17, 0.42, 0.34, 0.12, 0.14, 0.05, '#17121f']);
    P.push([ 0.17, 0.42, 0.34, 0.12, 0.14, 0.05, '#17121f']);
    P.push([-0.22, 0.56, 0.3, 0.12, 0.08, 0.05, 'rgba' in a ? b : dk(b, 1.5)]);
    return P;
  },
  flyer(a) {
    const P = [], b = a.body;
    P.push([0, 0.42, 0, 0.3, 0.34, 0.28, b]);
    P.push([0, 0.66, 0, 0.26, 0.2, 0.24, dk(b, 1.1)]);
    P.push([-0.13, 0.82, 0, 0.09, 0.16, 0.08, dk(b, 0.8)]);
    P.push([ 0.13, 0.82, 0, 0.09, 0.16, 0.08, dk(b, 0.8)]);
    P.push([-0.07, 0.68, 0.13, 0.06, 0.06, 0.03, a.eyes || '#ffd35a']);
    P.push([ 0.07, 0.68, 0.13, 0.06, 0.06, 0.03, a.eyes || '#ffd35a']);
    const f = Math.sin(T * 11) * 0.12;
    P.push([-0.42, 0.5 + f, -0.04, 0.56, 0.05, 0.3, dk(b, 0.72)]);
    P.push([ 0.42, 0.5 + f, -0.04, 0.56, 0.05, 0.3, dk(b, 0.72)]);
    P.push([-0.66, 0.56 + f * 1.6, -0.08, 0.3, 0.04, 0.2, dk(b, 0.62)]);
    P.push([ 0.66, 0.56 + f * 1.6, -0.08, 0.3, 0.04, 0.2, dk(b, 0.62)]);

  },
  wraith(a) {
    const P = [], b = a.body, w = Math.sin(T * 2) * 0.05;
    P.push([0, 0.16 + w, 0, 0.34, 0.3, 0.3, dk(b, 0.72)]);
    P.push([0, 0.44 + w, 0, 0.54, 0.3, 0.44, dk(b, 0.88)]);
    P.push([0, 0.72 + w, 0, 0.44, 0.26, 0.38, b]);
    P.push([0, 0.92 + w, 0, 0.3, 0.18, 0.28, dk(b, 1.08)]);
    P.push([-0.08, 0.92 + w, 0.15, 0.07, 0.09, 0.04, a.eyes || '#5ad8ff']);
    P.push([ 0.08, 0.92 + w, 0.15, 0.07, 0.09, 0.04, a.eyes || '#5ad8ff']);

    return P;
  },
  golem(a) {
    const P = [], b = a.body, ac = a.accent;
    P.push([-0.22, 0.16, 0, 0.3, 0.32, 0.34, dk(b, 0.7)]);
    P.push([ 0.22, 0.16, 0, 0.3, 0.32, 0.34, dk(b, 0.7)]);
    P.push([0, 0.52, 0, 0.78, 0.46, 0.5, b]);
    P.push([0, 0.5, 0.27, 0.42, 0.3, 0.06, dk(ac, 1.1)]);
    P.push([-0.52, 0.64, 0, 0.3, 0.3, 0.42, dk(b, 0.86)]);
    P.push([ 0.52, 0.64, 0, 0.3, 0.3, 0.42, dk(b, 0.86)]);
    P.push([-0.54, 0.32, 0, 0.3, 0.3, 0.34, dk(b, 0.78)]);
    P.push([ 0.54, 0.32, 0, 0.3, 0.3, 0.34, dk(b, 0.78)]);
    P.push([0, 0.86, 0, 0.42, 0.26, 0.38, dk(b, 1.1)]);
    P.push([-0.1, 0.88, 0.2, 0.09, 0.07, 0.04, a.eyes || '#ffb35a']);
    P.push([ 0.1, 0.88, 0.2, 0.09, 0.07, 0.04, a.eyes || '#ffb35a']);
    P.push([0, 1.0, 0, 0.5, 0.08, 0.44, ac]);
    return P;
  },
  dragon(a) {

function zAt(d) { return Z_START + Math.max(0, Math.min(TOTAL, d)); }
function zoneAt(z) { for (const Z of ZONES) if (z >= Z.z0 - 16 && z <= Z.z1 + 16) return Z; return null; }

const ROOMS = [];

    for (let l = 2; l >= 0; l--) ROOMS.push({ x:LANE_X[l], z, lane:l, zone:Z.no, d:z - Z_START });

}

const ENDLESS = -1;
function affixFor(n) {
  if (n < 4) return null;
  if (Math.random() > Math.min(0.75, 0.12 + n * 0.055)) return null;
  const keys = n < 9 ? ['elite','swift'] : ['elite','swift','armor','rage'];
  return keys[Math.floor(Math.random() * keys.length)];
}
function makeEndlessWave(n) {
  const mobs = ['vagrant','trainee','looter'], knights = ['lancer','ranger','warlock'], bosses = ['champion','paladin'];
  const pool = n < 3 ? mobs : n < 7 ? mobs.concat(knights) : knights;
  const out = [];
  const k = pool[Math.floor(Math.random() * pool.length)];
  out.push([k, Math.min(14, Math.round(3 + n * 0.7)), Math.max(0.55, 1.9 - n * 0.055), affixFor(n)]);
  if (n >= 4) {
    const k2 = knights[Math.floor(Math.random() * knights.length)];
    out.push([k2, Math.min(9, Math.round(1 + n * 0.38)), 1.5, affixFor(n)]);
  }
  if (n >= 5) out.push(['cleric', Math.min(4, 1 + Math.floor(n / 5)), 2.0, affixFor(n)]);
  if (n >= 8 && n % 3 === 2) out.push([bosses[n % 2], Math.max(1, Math.floor(n / 9)), 2.6, affixFor(n)]);
  return out;
}
function endlessMul(n) { return 1.2 * Math.pow(1.09, n); }

const REVIVE = { N:10, R:13, SR:16, SSR:21 };
const PULL = { minion:{ one:100, ten:900 }, trap:{ one:80, ten:720 } };

/* ================= 저장 ================= */
const SAVE_KEY = 'dungeon_lord_save_v5';
function defaultSave() {
  return { gems:600, own:{ slime:1, goblin:1, golem:1, spikes:1, web:1 },
           mteam:['golem','slime','goblin'], tteam:['spikes','web'], mslots:4, cleared:0, mute:false, endlessBest:0, adDay:'', adCount:0, battles:0 };
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.own && s.mteam) return s; } catch (e) {}
  return defaultSave();
}
let SAVE = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

function rollRarity() { const r = Math.random() * 100; return r < 1 ? 'SSR' : r < 8 ? 'SR' : r < 35 ? 'R' : 'N'; }
function pickFrom(pool, rar) { const p = pool.filter(k => DEF[k].rar === rar); return p[Math.floor(Math.random() * p.length)]; }
function doPull(cat, n) {
  const pool = cat === 'minion' ? MINIONS : TRAPSL, cost = n === 10 ? PULL[cat].ten : PULL[cat].one;
  if (SAVE.gems < cost) { L.msg = '수정이 부족해요. 관문을 더 돌아보세요'; return; }
  SAVE.gems -= cost;
  const res = []; let rare = false;
  for (let i = 0; i < n; i++) {
    let r = rollRarity();
    if (n === 10 && i === 9 && !rare) { while (RAR_RANK[r] < 1) r = rollRarity(); }
    if (RAR_RANK[r] >= 1) rare = true;
    const key = pickFrom(pool, r), o = { key, isNew:false, lvUp:false, refund:0 };
    if (!SAVE.own[key]) {
      SAVE.own[key] = 1; o.isNew = true;
      const team = DEF[key].kind === 'minion' ? SAVE.mteam : SAVE.tteam;
      const cap = DEF[key].kind === 'minion' ? SAVE.mslots : TRAP_SLOTS;
      if (team.length < cap) team.push(key);
    } else if (SAVE.own[key] < MAX_LV) { SAVE.own[key]++; o.lvUp = true; }
    else { o.refund = 15; SAVE.gems += 15; }
    res.push(o);
  }
  persist(); L.result = res; L.tab = cat;
  SFX.pull();
  let top = 'N'; for (const o of res) if (RAR_RANK[DEF[o.key].rar] > RAR_RANK[top]) top = DEF[o.key].rar;
  setTimeout(() => SFX.reveal(top), 260);
}
function toggleTeam(key) {
  if (!SAVE.own[key]) { L.msg = '아직 얻지 못한 카드예요'; return; }
  const isM = DEF[key].kind === 'minion';
  const team = isM ? SAVE.mteam : SAVE.tteam, cap = isM ? SAVE.mslots : TRAP_SLOTS;
  const i = team.indexOf(key);
  if (i >= 0) team.splice(i, 1);
  else if (team.length >= cap) { L.msg = (isM ? '부하' : '함정') + ' 슬롯이 ' + cap + '칸으로 꽉 찼어요'; return; }
  else team.push(key);
  persist();
}
function buySlot() {
  const next = SAVE.mslots + 1; if (next > MSLOT_MAX) return;
  if (SAVE.gems < MSLOT_COST[next]) { L.msg = '수정 ' + MSLOT_COST[next] + '개가 필요해요'; return; }
  SAVE.gems -= MSLOT_COST[next]; SAVE.mslots = next; persist();
  L.msg = '부하 슬롯이 ' + next + '칸으로 늘었어요';
}

/* ================= 효과음 (Web Audio 합성, 음원 파일 없음) ================= */
const SFX = (() => {
  let ctx = null, master = null, nbuf = null;
  const last = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
    nbuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function env(node, t0, dur, peak) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    node.connect(g); g.connect(master);
  }
  function osc(f1, f2, dur, type, vol, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(); o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
      env(o, t0, dur, vol === undefined ? 0.2 : vol);
      o.start(t0); o.stop(t0 + dur + 0.06);
    }
  }
  function nz(dur, vol, lp, delay) {
    if (!SAVE.mute && init()) {
      const t0 = ctx.currentTime + (delay || 0);
      const s = ctx.createBufferSource(); s.buffer = nbuf;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 2200;
      s.connect(f); env(f, t0, dur, vol === undefined ? 0.2 : vol);
      s.start(t0); s.stop(t0 + dur + 0.06);
    }
  }
  /* 같은 소리가 한꺼번에 겹쳐 터지면 찢어지므로 짧게 묶어 막는다 */
  function gate(name, ms) {
    const n = performance.now();
    if (last[name] && n - last[name] < (ms || 38)) return false;
    last[name] = n; return true;
  }
  return {
    unlock: init,
    tap()      { if (gate('tap', 60)) osc(880, 660, 0.035, 'square', 0.07); },
    place()    { if (gate('place', 80)) { osc(260, 560, 0.11, 'triangle', 0.16); nz(0.06, 0.1, 2600); } },
    swing()    { if (gate('swing', 45)) nz(0.07, 0.07, 1100); },
    hitHard(v) { if (gate('hitHard', 42)) { nz(0.09, 0.26 * v, 1500); osc(150, 55, 0.11, 'square', 0.16 * v); } },
    hitSoft()  { if (gate('hitSoft', 42)) nz(0.045, 0.12, 3000); },
    shoot()    { if (gate('shoot', 55)) osc(760, 250, 0.08, 'sawtooth', 0.09); },
    magic()    { if (gate('magic', 55)) osc(520, 1150, 0.13, 'sine', 0.1); },
    heal()     { if (gate('heal', 120)) { osc(620, 940, 0.16, 'sine', 0.09); } },
    die()      { if (gate('die', 60)) { osc(320, 70, 0.26, 'square', 0.14); nz(0.18, 0.16, 900); } },
    stone()    { if (gate('stone', 90)) { osc(190, 85, 0.24, 'sawtooth', 0.2); nz(0.12, 0.14, 700); } },
    roar()     { osc(95, 38, 0.6, 'sawtooth', 0.28); nz(0.5, 0.22, 420); },
    frenzy()   { osc(180, 520, 0.26, 'square', 0.14); osc(240, 640, 0.26, 'square', 0.1, 0.05); },
    seal()     { osc(1300, 2500, 0.3, 'sine', 0.11); osc(900, 1700, 0.34, 'sine', 0.08, 0.04); },
    fall()     { osc(1400, 260, 0.6, 'sine', 0.08); },
    boom()     { nz(0.5, 0.36, 520); osc(130, 32, 0.5, 'square', 0.26); },
    wave()     { osc(300, 300, 0.16, 'square', 0.16); osc(400, 400, 0.22, 'square', 0.16, 0.16); },
    win()      { [523, 659, 784, 1047].forEach((f, i) => osc(f, f, 0.2, 'triangle', 0.16, i * 0.11)); },
    lose()     { [392, 330, 262, 196].forEach((f, i) => osc(f, f, 0.26, 'sawtooth', 0.15, i * 0.13)); },
    pull()     { nz(0.3, 0.14, 1800); osc(300, 900, 0.3, 'sine', 0.1); },
    reveal(r)  { const n = { N:1, R:2, SR:3, SSR:5 }[r] || 1;
                 for (let i = 0; i < n; i++) osc(700 + i * 220, 1200 + i * 260, 0.13, 'sine', 0.11, i * 0.07); },
  };
})();

}

const cam = { yaw:PI, pitch:1.500, dist:640, tx:MAPC.x, ty:0, tz:MAPC.z };

    else if (dist2(b.x, b.z, b.hx, b.hz) > 2) { gx = b.hx; gz = b.hz; }
    if (gx !== null) {
      let dx = gx - b.x, dz = gz - b.z;
      const dl = Math.hypot(dx, dz);
      if (dl > 1) {
        const stp = Math.min(dl, b.def.spd * dt);
        let nx = b.x + dx / dl * stp, nz = b.z + dz / dl * stp;
        /* 제 자리에서 행동 반경 밖으로는 못 나간다 */
        const ox = nx - b.hx, oz = nz - b.hz, od = Math.hypot(ox, oz);
        if (od > lim) { nx = b.hx + ox / od * lim; nz = b.hz + oz / od * lim; }
        const mx = nx - b.x, mz = nz - b.z;
        b.x = nx; b.z = nz;
        if (Math.abs(mx) + Math.abs(mz) > 0.01) { b.yaw = Math.atan2(mx, mz); b.moving = 1; }
      }
    }
  }
  const fr = G.frenzy > 0 ? 0.5 : 1;
  for (const b of G.rooms) {
    if (!b || b.def.kind !== 'minion') continue;
    b.cd -= dt;
    const kd2 = Math.exp(-dt * 11);
    if (b.kbx) b.kbx *= kd2; if (b.kbz) b.kbz *= kd2;
    if (b.atk > 0) b.atk -= dt * 3.1;
    if (b.hitT > 0) b.hitT -= dt * 4.2;
    if (b.spawnT > 0) b.spawnT -= dt * 2.6;
    if (b.cd > 0) continue;
    let tg = null, best = 1e9;
    for (const h of G.heroes) { const dd = dist2(h.x, h.z, b.x, b.z); if (dd <= b.def.rng && dd < best) { best = dd; tg = h; } }
    if (tg) {
      b.cd = b.def.cd * fr; b.atk = 1;
      b.yaw = Math.atan2(tg.x - b.x, tg.z - b.z);
      if (b.def.shot) { fxShot(b.x, b.z, tg.x, tg.z, '#e8e8ff'); if (b.def.aoe) SFX.magic(); else SFX.shoot(); }
      else { fxSlash(tg.x, tg.z, '#ffffff'); SFX.swing(); }
      const vic = b.def.aoe ? G.heroes.filter(h => dist2(h.x, h.z, tg.x, tg.z) < 52) : [tg];
      const big2 = b.dmg >= 18;
      for (const v of vic) {
        const dd = dmgHero(v, b.dmg);
        fxText(v.x, v.z, '-' + Math.round(dd), '#ffffff');
        burst(v.x, 16, v.z, 4, '#ffffff', 46, v.x - b.x, v.z - b.z);
        knock(v, v.x - b.x, v.z - b.z, Math.min(11, b.dmg * 0.5));
        if (b.def.slow) { v.slow = 1.5; v.slowF = b.def.slow; }
      }
      if (!b.def.shot) { if (big2) { hitstop(0.05); punch(26); SFX.hitHard(1); } else SFX.hitSoft(); }
    }
  }
  for (const b of G.rooms) {
    if (!b || b.def.kind !== 'trap') continue;
    b.cd -= dt;
    if (b.def.slow) for (const h of G.heroes) if (dist2(h.x, h.z, b.x, b.z) <= b.def.rng) { h.slow = 0.3; h.slowF = b.def.slow; }
    if (b.cd > 0) continue;
    const hit = G.heroes.filter(h => dist2(h.x, h.z, b.x, b.z) <= b.def.rng);
    if (hit.length) {
      b.cd = b.def.cd; b.flash = 0.2; if (b.dmg >= 26) { SFX.hitHard(0.8); hitstop(0.035); } else if (b.dmg > 0) SFX.hitSoft();
      for (const h of hit) {
        if (b.dmg > 0) { const dd2 = dmgHero(h, b.dmg); fxText(h.x, h.z, '-' + Math.round(dd2), '#ffa94d'); burst(h.x, 14, h.z, 4, '#ffa94d', 46, h.x - b.x, h.z - b.z); }
        if (b.def.push) { h.d = Math.max(0, h.d - b.def.push); const p = posAt(h.d); h.x = p[0]; h.z = p[1]; fxText(h.x, h.z, '밀려남', '#8be9ff'); }
      }
    }
  }
  for (const b of G.rooms) if (b && b.flash > 0) b.flash -= dt;

  for (let i = 0; i < NROOM; i++) if (G.rooms[i] && G.rooms[i].hp <= 0) {
    const b = G.rooms[i]; burst(b.x, 16, b.z, 16, '#ff6b6b', 80);
    G.corpses.push({ key:b.key, def:b.def, x:b.x, z:b.z, yaw:b.yaw, t:1, dir:Math.random() < 0.5 ? -1 : 1 });
    /* 부하는 사라지지 않고 제 방에서 다시 일어선다. 긴 웨이브에서 전멸하지 않게 하는 핵심 장치 */
    const full = REVIVE[b.def.rar] || 12;
    G.revive.push({ i, key:b.key, def:b.def, maxHp:b.maxHp, dmg:b.dmg, hx:b.hx, hz:b.hz, d:b.homeD, t:full, full });
    G.rooms[i] = null; SFX.die(); hitstop(0.05);
  }
  for (const h of G.heroes) if (h.hp <= 0) {
    G.gems += h.def.rew; fxText(h.x, h.z, '+' + h.def.rew, '#8be9ff'); burst(h.x, 16, h.z, 10, '#8be9ff', 60);
    G.corpses.push({ key:h.type, def:h.def, x:h.x, z:h.z, yaw:h.yaw, t:1, dir:Math.random() < 0.5 ? -1 : 1 });
    SFX.die(); hitstop(h.def.tier === 'hero' ? 0.09 : 0.04); if (h.def.tier === 'hero') punch(34);
  }
  G.heroes = G.heroes.filter(h => h.hp > 0);

  if (G.stone <= 0) { G.stone = 0; G.phase = 'lose'; shake = 18; punch(50); finishBattle(); SFX.lose(); return; }
  if (!G.queue.length && !G.heroes.length) {
    G.gems += WAVE_GEMS;
    if (!G.endless && G.wIdx >= waveCount() - 1) { G.phase = 'win'; finishBattle(); SFX.win(); }
    else {
      G.wIdx++; G.phase = 'prep';
      for (const r of G.revive) if (!G.rooms[r.i]) {
        G.rooms[r.i] = { key:r.key, def:r.def, hp:r.maxHp, maxHp:r.maxHp, dmg:r.dmg, cd:0,
                         x:r.hx, z:r.hz, hx:r.hx, hz:r.hz, d:r.d, homeD:r.d, yaw:0, atk:0, hitT:0,
                         bobOff:Math.random() * 6.283, moving:0, spawnT:1, kbx:0, kbz:0, dustT:0 };
      }
      G.revive = [];
      const used = {}; for (const b of G.rooms) if (b) used[b.key] = (used[b.key] || 0) + 1;
      const hand = {}; for (const k of SAVE.mteam.concat(SAVE.tteam)) hand[k] = used[k] ? 0 : 1;
      G.hand = hand;
      for (const b of G.rooms) if (b) { b.hp = b.maxHp; b.x = b.hx; b.z = b.hz; b.d = b.homeD; }
      G.moveCd = 0; camTo('prep', 1.2);
      say('웨이브 돌파! 수정 +' + WAVE_GEMS + ' · 부하 회복 · 쓰러진 카드 복귀');
    }
  }
}

/* 네이티브(안드로이드 WebView)가 window.AndroidAds를 주입하면 진짜 광고를 띄우고,
   브라우저에서는 같은 흐름을 그대로 흉내 내는 모의 광고를 보여 준다.
   덕분에 앱으로 싸기 전에도 광고 동선을 그대로 테스트할 수 있다. */
const AD_DAILY_MAX = 5, AD_DAILY_GEMS = 150;
const ADV = { on:false, t:0, dur:5, label:'', cb:null, done:false, kind:'reward' };
const ADS = (() => {
  function nat() {
    const a = window.AndroidAds;
    return a && typeof a.showRewarded === 'function' ? a : null;
  }
  /* 네이티브가 광고 종료 시 호출한다 */
  window.onAdResult = function (ok) {
    const cb = ADV.cb; ADV.on = false; ADV.cb = null;
    if (cb) cb(!!ok);
  };
  return {
    hasNative() { return !!nat(); },
    rewarded(label, cb) {
      const n = nat();
      if (n) { ADV.cb = cb; ADV.on = false; try { n.showRewarded(); } catch (e) { ADV.cb = null; cb(false); } return; }
      ADV.on = true; ADV.t = 0; ADV.dur = 5; ADV.label = label; ADV.cb = cb; ADV.done = false; ADV.kind = 'reward';
    },
    interstitial() {
      const n = nat();
      if (n && typeof n.showInterstitial === 'function') { try { n.showInterstitial(); } catch (e) {} return; }
      ADV.on = true; ADV.t = 0; ADV.dur = 3; ADV.label = '전면 광고'; ADV.cb = null; ADV.done = false; ADV.kind = 'inter';
    },
  };
})();
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function adLeftToday() {
  if (SAVE.adDay !== todayKey()) { SAVE.adDay = todayKey(); SAVE.adCount = 0; persist(); }
  return AD_DAILY_MAX - (SAVE.adCount || 0);
}
function claimDailyAd() {
  if (adLeftToday() <= 0) { L.msg = '오늘 받을 수 있는 광고 보상을 다 받았어요'; return; }
  ADS.rewarded('수정 ' + AD_DAILY_GEMS + '개', ok => {
    if (!ok) return;
    SAVE.adCount = (SAVE.adCount || 0) + 1;
    SAVE.gems += AD_DAILY_GEMS; persist();
    L.msg = '수정 ' + AD_DAILY_GEMS + '개를 받았어요';

}
function doubleReward() {

    G.doubled = true; SAVE.gems += G.gems; G.gems *= 2; persist(); SFX.reveal('SR');

  if (G.usedContinue) return;

    G.stone = Math.ceil(G.maxStone * 0.5);

    const used = {}; for (const b of G.rooms) if (b) used[b.key] = 1;

function txt(t, x, y, size, col, align) {

function rbox(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function bar2(x, y, w, h, ratio, col) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, h);

/* 참고 이미지처럼: 머리 위에 동그란 아이콘 + 옆에 붙은 체력바 */
function drawPlates(Q) {
  if (!Q.length) return;
  const out = [];
  for (const q of Q) {
    const s2 = proj(q[1], q[2], q[3]); if (!s2) continue;
    const k = RT.fov / s2[2];
    let r = 13 * k; if (r < 6) r = 6; if (r > 20) r = 20;
    if (q[7] === 2) r *= 0.72;
    out.push({ z:s2[2], x:s2[0], y:s2[1] - q[6] * k - r - 5, r, q });
  }
  /* 가까운 것부터 자리를 잡고, 겹치는 것은 위로 밀어 올려 서로 가리지 않게 한다 */
  out.sort((a, b) => a.z - b.z);
  const put = [];
  for (const o of out) {
    const w = o.q[5] >= 0 ? o.r * 3.4 : o.r * 2;
    o.l = o.x - o.r; o.rr = o.x - o.r + w;
    for (let t = 0; t < 14; t++) {
      let hit = false;
      for (const u of put) {
        if (o.rr < u.l || o.l > u.rr) continue;
        const gap = (o.r + u.r) * 0.92;
        if (Math.abs(o.y - u.y) < gap) { o.y = u.y - gap; hit = true; }
      }
      if (!hit) break;
    }
    put.push(o);
  }
  out.sort((a, b) => b.z - a.z);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const o of out) {
    const q = o.q, hp = q[5], hero = q[7], r = o.r, cx = o.x, cy = o.y;
    if (hp >= 0) {
      const bw = r * 2.5, bh = r * 0.6, bx = cx + r * 0.78, by = cy - bh / 2;
      ctx.fillStyle = 'rgba(8,5,14,.75)'; rbox(bx - 2, by - 2, bw + 4, bh + 4, bh * 0.7 + 2); ctx.fill();
      ctx.fillStyle = 'rgba(44,32,58,.95)'; rbox(bx, by, bw, bh, bh * 0.5); ctx.fill();
      const w2 = Math.max(bh, bw * Math.max(0, Math.min(1, hp)));
      ctx.fillStyle = hero ? '#e8574c' : '#5fd071'; rbox(bx, by, w2, bh, bh * 0.5); ctx.fill();
      ctx.fillStyle = hero ? 'rgba(255,176,166,.45)' : 'rgba(192,255,202,.45)';
      rbox(bx, by, w2, bh * 0.4, bh * 0.3); ctx.fill();
    }
    ctx.globalAlpha = hero === 2 ? 0.8 : 1;
    ctx.fillStyle = 'rgba(12,8,20,.92)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = q[4]; ctx.lineWidth = Math.max(1.4, r * 0.17);
    ctx.beginPath(); ctx.arc(cx, cy, r - ctx.lineWidth * 0.5, 0, 7); ctx.stroke();
    ctx.font = (r * 1.2) + 'px sans-serif';
    ctx.fillText(q[0], cx, cy + r * 0.06);
    ctx.globalAlpha = 1;
  }
}

/* ================= 전투 3D ================= */
const ZONE_X0 = 50, ZONE_X1 = 310, ZONE_W = ZONE_X1 - ZONE_X0;
/* 정지 그림 한 장으로 생동감을 만드는 자세 계산.
   숨쉬기 / 걷기 통통 / 공격 준비-내지름 / 피격 떨림·납작 / 등장 */
function pose(u, baseY) {
  const atk = u.atk > 0 ? u.atk : 0, hit = u.hitT > 0 ? u.hitT : 0;
  const walk = u.moving > 0 ? u.moving : 0, sp = u.spawnT > 0 ? u.spawnT : 0;
  const t = T + (u.bobOff || 0);
  const idle = Math.sin(t * 2.3) * 1.3;
  const step = walk * Math.abs(Math.sin(t * 9.5)) * 5;
  /* 준비(천천히 뒤로) → 가격(순간적으로 앞으로) → 복귀(부드럽게) */
  let push = 0, tilt = 0;
  if (atk > 0) {
    const pr = 1 - atk;
    if (pr < 0.30) { const k = pr / 0.30, e = 1 - Math.pow(1 - k, 3); push = -7 * e; tilt = 0.17 * e; }
    else if (pr < 0.46) { const k = (pr - 0.30) / 0.16, e = k * k; push = -7 + 26 * e; tilt = 0.17 - 0.45 * e; }
    else { const k = (pr - 0.46) / 0.54, e = 1 - Math.pow(1 - k, 3); push = 19 * (1 - e); tilt = -0.28 * (1 - e); }
  }
  tilt += walk * Math.sin(t * 9.5) * 0.05;
  const shk = hit > 0 ? (Math.random() - 0.5) * 6 * hit : 0;
  const sx = (1 + walk * 0.04 - hit * 0.12 + atk * 0.04) * (1 - sp * 0.35);
  const sy = (1 - walk * 0.05 + hit * 0.14 - atk * 0.03) * (1 - sp * 0.35);
  return { y:baseY + idle + step + sp * 30, push, shk, kx:u.kbx || 0, kz:u.kbz || 0,
           o:{ tilt, sx, sy, flash:hit, alpha:1 - sp * 0.7, flip:Math.sin((u.yaw || 0) + cam.yaw) < 0 } };
}

function drawScene() {
  cam.dist -= camPunch;
  const sk = shake > 0 ? shake : 0;
  const ox = sk ? (Math.random() - 0.5) * sk : 0, oy = sk ? (Math.random() - 0.5) * sk : 0;
  beginScene(ctx, cam, VCX + ox, VCY + oy, FOV);

  /* 바닥 — 큰 판 하나면 깊이 정렬이 깨지므로 타일로 쪼갠다 */
  for (let gx = 0; gx < 6; gx++) for (let gz = 0; gz < 10; gz++) {
    pushBox(10 + 60 * gx + 30, -20, Z_START - 60 + 80 * gz + 40, 60, 20, 80, ((gx + gz) & 1) ? '#140e1f' : '#171024');
  }
  /* 구역 바닥: 3줄 × 4단으로 깔아서 줄이 눈에 보이게 */
  for (const Z of ZONES) {
    const cw = ZONE_W / 3, rh = (Z.z1 - Z.z0) / 4;
    for (let c = 0; c < 3; c++) for (let r = 0; r < 4; r++) {
      pushBox(ZONE_X0 + cw * c + cw / 2, -4, Z.z0 + rh * r + rh / 2, cw - 2, 10, rh - 2,
              ((c + r) & 1) ? '#3a3054' : '#332a4a');
    }
    /* 구역 모서리 기둥과 횃불 */
    for (const px of [ZONE_X0 - 14, ZONE_X1 + 14]) for (const pz of [Z.z0 - 8, Z.z1 + 8]) {
      pushBox(px, 18, pz, 18, 44, 18, '#241d38');
      const g = 0.6 + Math.sin(T * 4 + px + pz) * 0.3;
      pushBox(px, 46, pz, 10, 11, 10, dk('#ff8a3a', 0.7 + g * 0.5));
    }
  }
  /* 구역 사이 연결 통로 */
  const links = [[Z_START, ZONES[0].z0], [ZONES[0].z1, ZONES[1].z0], [ZONES[1].z1, ZONES[2].z0], [ZONES[2].z1, Z_END]];
  for (const [a2, b2] of links) {
    const n = Math.max(1, Math.round((b2 - a2) / 30));
    for (let i = 0; i < n; i++) {
      const h = (b2 - a2) / n;
      pushBox(180, -4, a2 + h * i + h / 2, 86, 10, h - 2, (i & 1) ? '#2e2545' : '#2a2140');
    }
  }
  /* 입구 */
  pushBox(140, 24, Z_START, 14, 48, 14, '#5a4330');
  pushBox(220, 24, Z_START, 14, 48, 14, '#5a4330');
  pushBox(180, 52, Z_START, 94, 10, 14, '#6b5038');

  /* 배치 칸 */
  for (let i = 0; i < NROOM; i++) {
    const r = ROOMS[i], b = G.rooms[i];
    const col = i === G.sel ? '#7a6630' : (G.moveFrom >= 0 && !b) ? '#2f5f3f' : b ? '#2a2440' : '#473c66';
    pushBox(r.x, 3, r.z, 36, 7, 36, col);
  }

  pushBox(STONE.x, 2, STONE.z, 76, 12, 76, '#2a2242');
  const si = cam.pitch > 1.25 ? null : unitImg('__stone');
  if (!si) drawModel(CRYSTAL(), STONE.x, 8, STONE.z, 46, 0);
  const bbQ = [], simple = cam.pitch > 1.25, icoQ = [], plQ = [];
  for (let i = 0; i < NROOM; i++) {
    const b = G.rooms[i]; if (!b) continue;
    if (b.def.kind === 'minion') {
      const fly = b.def.fly ? 14 + Math.sin(T * 3 + i) * 4 : 0;
      const P = pose(b, 9 + fly);
      const bx = b.x + Math.sin(b.yaw) * P.push + P.shk + P.kx, bz = b.z + Math.cos(b.yaw) * P.push + P.kz;
      if (simple) { icoQ.push([b.def.ico, b.x, b.z, RAR_COL[b.def.rar], b.hp / b.maxHp]); }
      else {
        const im = unitImg(b.key);
        plQ.push([b.def.ico, bx, P.y, bz, RAR_COL[b.def.rar], b.hp / b.maxHp, b.def.sc * 1.55, 0]);
        if (im) bbQ.push([im, bx, P.y, bz, b.def.sc * 1.55, P.o, 2]);
        else drawModel(modelOf(b.key, b.def.art), bx, P.y, bz, b.def.sc, b.yaw);
      }
    } else if (simple) { icoQ.push([b.def.ico, b.x, b.z, RAR_COL[b.def.rar], -1]); }
    else {
      const im = unitImg(b.key);
      if (im) bbQ.push([im, b.x, 9, b.z, b.def.sc * 0.9, NOOPT, 2]);
      else drawModel(TRAPM[b.key](), b.x, 9, b.z, b.def.sc, 0);
      plQ.push([b.def.ico, b.x, 9, b.z, RAR_COL[b.def.rar], -1, b.def.sc * 0.9, 2]);
    }
  }
  for (const h of G.heroes) {
    const P = pose(h, 9);
    const hx = h.x + Math.sin(h.yaw) * P.push + P.shk + P.kx, hz = h.z + Math.cos(h.yaw) * P.push + P.kz;
    const im = unitImg(h.type);
    const hsz = h.def.sc * (h.scl || 1);
    if (simple) icoQ.push([h.def.ico, h.x, h.z, h.A ? h.A.col : TIER_COL[h.def.tier], h.hp / h.maxHp, 1]);
    else {
      if (im) bbQ.push([im, hx, P.y, hz, hsz * 1.55, P.o, 2]);
      else drawModel(modelOf(h.type, h.def.art), hx, P.y, hz, hsz, h.yaw);
      plQ.push([h.def.ico, hx, P.y, hz, h.A ? h.A.col : TIER_COL[h.def.tier], h.hp / h.maxHp, hsz * 1.55, 1]);
    }
  }
  /* 쓰러진 유닛: 옆으로 넘어지며 사라진다 */
  for (const c of G.corpses) {
    const im = unitImg(c.key); if (!im) continue;
    const k = 1 - c.t;
    bbQ.push([im, c.x, 9, c.z, c.def.sc * 1.55,
      { tilt:c.dir * 1.45 * Math.min(1, k * 1.8), alpha:Math.min(1, c.t * 1.6),
        sx:1 + k * 0.1, sy:1 - k * 0.15, flash:Math.max(0, 1 - k * 4), shadow:false,
        flip:Math.sin((c.yaw || 0) + cam.yaw) < 0 }, 2]);
  }
  for (const m of G.meteors) {
    pushBox(m.x, m.y + 14, m.z, 24, 24, 24, '#ff7a2a');
    pushBox(m.x, m.y + 36, m.z, 14, 20, 14, '#ffd35a');
  }
  endScene();
  if (si) pushBillboard(si, STONE.x, 10 + Math.sin(T * 1.6) * 2, STONE.z, 56, { sy:1 + Math.sin(T * 1.6) * 0.02 }, 2);
  for (const q of bbQ) pushBillboard(q[0], q[1], q[2], q[3], q[4], q[5], q[6]);
  drawBillboards();
  /* 위에서 내려다보는 배치 시점에서는 일러스트 대신 알아보기 쉬운 아이콘 */
  for (const q of icoQ) {
    const s2 = proj(q[1], 14, q[2]); if (!s2) continue;
    const r = 15 * (540 / s2[2]) * 1.3;
    ctx.fillStyle = 'rgba(14,10,22,.85)'; ctx.beginPath(); ctx.arc(s2[0], s2[1], r, 0, 7); ctx.fill();
    ctx.strokeStyle = q[3]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s2[0], s2[1], r, 0, 7); ctx.stroke();
    ctx.font = (r * 1.25) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(q[0], s2[0], s2[1] + r * 0.06);
    if (q[4] >= 0) bar2(s2[0] - r, s2[1] + r + 2, r * 2, 3.5, q[4], q[5] ? '#e8574c' : '#6bdc7a');
  }
  drawPlates(plQ);

  /* --- 3D 위에 겹치는 2D 표시 --- */
  if (G.sel >= 0) {
    ground3(ROOMS[G.sel].x, ROOMS[G.sel].z, 30, '#ffd35a', 2);
    const b = G.rooms[G.sel]; if (b) ground3(b.x, b.z, b.def.rng, 'rgba(255,211,90,.45)', 1.5);
  }
  if (G.moveFrom >= 0) for (let i = 0; i < NROOM; i++) if (!G.rooms[i]) ground3(ROOMS[i].x, ROOMS[i].z, 28, '#6bdc7a', 2);
  if (G.frenzy > 0) for (const b of G.rooms) if (b && b.def.kind === 'minion') ground3(b.x, b.z, 24, 'rgba(255,90,90,.7)', 2, 14);
  for (const f of G.fx) {
    const a = f.life / f.max;
    if (f.k === 'ring') ground3(f.x, f.z, (1 - a) * f.r, f.col, 3 * a + 1);
    else if (f.k === 'slash') {
      const p = proj(f.x, 20, f.z); if (!p) continue;
      const sc2 = 540 / p[2], prog = 1 - a;
      ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(f.a);
      for (let g = 0; g < 3; g++) {
        const gp = Math.max(0, prog - g * 0.13);
        ctx.globalAlpha = a * (1 - g * 0.32) * 0.95;
        ctx.strokeStyle = f.col; ctx.lineWidth = (3.6 - g) * sc2 * 0.9 + 0.6;
        ctx.beginPath(); ctx.arc(0, 0, (9 + gp * 26) * sc2, -1.15 + gp * 1.7, -0.35 + gp * 1.7); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  for (const b of G.bolts) {
    const p = proj(b.x, 20, b.z); if (!p) continue;
    const q = proj(b.x - (b.x2 - b.x1) * 0.14, 20, b.z - (b.z2 - b.z1) * 0.14);
    if (q) { ctx.globalAlpha = 0.6; ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(p[0], p[1], 2.4 * (540 / p[2]) + 1.2, 0, 7); ctx.fill();
  }
  for (const p of G.parts) {
    const s = proj(p.x, p.y, p.z); if (!s) continue;
    ctx.globalAlpha = Math.min(1, p.life / 0.4); ctx.fillStyle = p.col;
    const r = p.sz * (540 / s[2]); ctx.beginPath(); ctx.arc(s[0], s[1], Math.max(0.6, r), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < NROOM; i++) {
    const b = G.rooms[i];
    if (!b) {
      const s = proj(ROOMS[i].x, 10, ROOMS[i].z); if (!s) continue;
      const rv = G.revive.find(v => v.i === i);
      if (rv) {
        const k = 1 - rv.t / rv.full;
        ctx.globalAlpha = 0.35 + Math.sin(T * 6) * 0.15;
        txt(Math.ceil(rv.t) + '초', s[0], s[1] - 8, 11, '#c77dff', 'center');
        ctx.globalAlpha = 1;
        const w = 26 * (540 / s[2]) * 1.2;
        bar2(s[0] - w / 2, s[1] + 4, w, 3.5, k, '#c77dff');
      } else txt(String(i + 1), s[0], s[1], 11, '#7b6a95', 'center');
    }
    else if (b.def.kind === 'minion') {
      const s = proj(b.x, b.def.sc * (unitImg(b.key) ? 1.62 : 1.3), b.z); if (!s) continue;
      const w = 30 * (540 / s[2]) * 1.2; bar2(s[0] - w / 2, s[1] - 4, w, 4, b.hp / b.maxHp, '#6bdc7a');
    }
  }
  for (const h of G.heroes) {
    const s = proj(h.x, h.def.sc * (h.scl || 1) * (unitImg(h.type) ? 1.62 : 1.25), h.z); if (!s) continue;
    const w = (h.def.tier === 'hero' ? 42 : 28) * (540 / s[2]) * 1.2;
    const col = h.A ? h.A.col : TIER_COL[h.def.tier];
    ctx.fillStyle = col; ctx.fillRect(s[0] - w / 2 - 2.5, s[1] - 5, 2.5, 6);
    bar2(s[0] - w / 2, s[1] - 5, w, 4.5, h.hp / h.maxHp, h.slow > 0 ? '#78b6ff' : '#ff6b6b');
    if (h.A) txt(h.A.name, s[0], s[1] - 14, 9, col, 'center');
  }
  const st = proj(STONE.x, 72, STONE.z);
  if (st) bar2(st[0] - 40, st[1] - 10, 80, 7, G.stone / G.maxStone, '#8b5cf6');
  for (const f of G.fx) if (f.k === 'txt') {
    const a = f.life / f.max, s = proj(f.x, f.y + (1 - a) * 28, f.z);
    if (!s) continue;
    const grow = a > 0.78 ? 1 + (a - 0.78) * 2.6 : 1;
    ctx.globalAlpha = Math.min(1, a * 1.8);
    ctx.save(); ctx.translate(s[0], s[1]); ctx.scale(grow, grow);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText(f.txt, 0, 0); ctx.fillStyle = f.col; ctx.fillText(f.txt, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (G.seal > 0) { ctx.fillStyle = 'rgba(90,180,255,.12)'; ctx.fillRect(0, 0, W, PANEL_Y); }
  cam.dist += camPunch;
}

/* ================= 전투 UI ================= */
function drawGame() {
  BTN = [];
  ctx.fillStyle = '#0b0712'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, PANEL_Y); ctx.clip();
  drawScene();
  ctx.restore();

  /* 상단 HUD */
  ctx.fillStyle = 'rgba(8,6,14,.88)'; ctx.fillRect(0, 0, W, 38);
  const S = curStage();
  txt(G.endless ? '∞ 무한의 문' : '제' + S.no + '관문 · ' + S.name, 10, 12, 12, '#fff');
  txt((G.endless ? '웨이브 ' + (G.wIdx + 1) + (SAVE.endlessBest ? '  (최고 ' + SAVE.endlessBest + ')' : '')
                : '웨이브 ' + (G.wIdx + 1) + '/' + waveCount()) + '   ◆ +' + G.gems, 10, 28, 11, '#8be9ff');
  txt('수호석', 210, 12, 10, '#c9b8ff'); bar2(250, 8, 100, 9, G.stone / G.maxStone, '#8b5cf6');
  txt(Math.ceil(G.stone) + ' / ' + G.maxStone, 350, 28, 10, '#c9b8ff', 'right');
  if (G.frenzy > 0) txt('광기 ' + G.frenzy.toFixed(1) + 's', 150, 28, 10, '#ff6b6b');
  if (G.msgT > 0) { ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 42, W, 20); txt(G.msg, W / 2, 52, 11, '#ffe9a8', 'center'); }
  if (G.aim) { ctx.globalAlpha = 0.6 + Math.sin(T * 8) * 0.3; txt('운석을 떨어뜨릴 곳을 누르세요', 12, 76, 13, '#ffa94d'); ctx.globalAlpha = 1; }

  /* 시점 버튼 */
  btn(W - 74, 68, 62, 22, SAVE.mute ? '소리 꺼짐' : '소리 켜짐',
      () => { SAVE.mute = !SAVE.mute; persist(); }, { bg:'rgba(40,32,60,.85)', fs:10, fc:SAVE.mute ? '#8a7aa5' : '#8be9ff' });
  /* 구역 바로가기 */
  ZONES.forEach((Z, i) => {
    btn(10 + i * 46, 68, 42, 22, Z.no + '구역', () => camToZone(i),
        { bg:camMode === 'zone' + i ? 'rgba(90,60,40,.9)' : 'rgba(40,32,60,.85)', fs:10, on:camMode === 'zone' + i });
  });
  btn(148, 68, 46, 22, '전체', () => camTo(G.phase === 'run' ? 'battle' : 'prep', 0.6),
      { bg:'rgba(40,32,60,.85)', fs:10 });
  txt(G.phase === 'run' ? '드래그로 시점 이동' : '배치 시점 (위에서)', W - 12, 98, 9, '#6b5a85', 'right');

  /* 하단 패널 */
  ctx.fillStyle = '#0c0812'; ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
  const list = SAVE.mteam.concat(SAVE.tteam);
  const bw = Math.min(46, Math.floor((W - 16 - 4 * (list.length - 1)) / list.length)), gp = 4;
  const x0 = (W - (bw * list.length + gp * (list.length - 1))) / 2;
  list.forEach((k, i) => {
    const d = DEF[k], left = G.hand[k] || 0, ok = left > 0 && G.sel >= 0 && !G.rooms[G.sel];
    const x = x0 + i * (bw + gp), y = PANEL_Y + 6;
    BTN.push({ x, y, w:bw, h:58, act:() => place(k), label:'카드:' + k });
    ctx.fillStyle = ok ? '#2c2340' : '#1a1524'; rbox(x, y, bw, 58, 7); ctx.fill();
    ctx.strokeStyle = ok ? '#ffd35a' : RAR_COL[d.rar]; ctx.lineWidth = ok ? 2 : 1.2; rbox(x, y, bw, 58, 7); ctx.stroke();
    ctx.globalAlpha = left > 0 ? 1 : 0.25;
    const hi = unitImg(k);
    if (hi) fitImg(ctx, hi, x + bw / 2, y + 44, bw - 6, 40);
    else ctx.drawImage(thumb(k), x + bw / 2 - 21, y + 3, 42, 42);
    ctx.globalAlpha = 1;
    txt(left > 0 ? 'Lv' + (SAVE.own[k] || 1) : '배치됨', x + bw / 2, y + 49, 9, left > 0 ? '#c9b8ff' : '#6b5a85', 'center');
  });
  const sy = PANEL_Y + 70, sw = 82, sg = 6, sx = (W - (sw * 4 + sg * 3)) / 2;
  SKILLS.forEach((s, i) => {
    const cd = G.scd[s.key], ready = G.phase === 'run' && cd <= 0;
    btn(sx + i * (sw + sg), sy, sw, 36, s.name, () => castSkill(s.key), {
      dis:!ready, bg:G.aim === s.key ? '#8a4a1a' : '#4a2a5a', fs:13, on:G.aim === s.key,
      sub:cd > 0 ? Math.ceil(cd) + '초' : s.desc.slice(0, 9), sc:cd > 0 ? '#ffa94d' : '#9a8ab5' });
  });
  const cy = sy + 42;
  btn(sx, cy, sw, 36, G.phase === 'prep' ? '웨이브 시작' : '진행 중', startWave, { dis:G.phase !== 'prep', bg:'#5d2f3f', fs:12 });
  const mv = G.sel >= 0 && G.rooms[G.sel] && (G.phase === 'prep' || G.moveCd <= 0);
  btn(sx + sw + sg, cy, sw, 36, G.moveCd > 0 && G.phase === 'run' ? '재배치 ' + Math.ceil(G.moveCd) : '재배치', startMove, { dis:!mv, bg:'#2b4a3a', fs:12, on:G.moveFrom >= 0 });
  btn(sx + (sw + sg) * 2, cy, sw, 36, '회수', pickUp, { dis:G.sel < 0 || !G.rooms[G.sel] || G.phase !== 'prep', fs:12 });
  btn(sx + (sw + sg) * 3, cy, sw, 36, '속도 ×' + G.speed, () => { G.speed = G.speed === 1 ? 2 : 1; }, { fs:12 });

  if (G.phase === 'win' || G.phase === 'lose') {
    ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(0, 0, W, H);
    const win = G.phase === 'win';
    if (G.endless) {
      txt('무한의 문', W / 2, 240, 22, '#c77dff', 'center');
      txt(G.reached + ' 웨이브 돌파', W / 2, 284, 26, '#ffd35a', 'center');
      if (G.first) txt('최고 기록 경신!', W / 2, 318, 14, '#6bdc7a', 'center');
      else txt('최고 기록 ' + SAVE.endlessBest + ' 웨이브', W / 2, 318, 13, '#9a8ab5', 'center');
      txt('획득 ◆ ' + G.gems, W / 2, 352, 19, '#8be9ff', 'center');
    } else {
      txt(win ? '관문 돌파!' : '수호석이 부서졌다', W / 2, 250, 24, win ? '#ffd35a' : '#ff6b6b', 'center');
      txt('제' + S.no + '관문 · ' + S.name, W / 2, 286, 14, '#c9b8ff', 'center');
      if (win && G.first) txt('다음 관문이 열렸어요', W / 2, 314, 13, '#6bdc7a', 'center');
      txt('획득 ◆ ' + G.gems, W / 2, 348, 19, '#8be9ff', 'center');
    }
    const canDouble = !G.doubled && G.gems > 0;
    const canCont = !G.usedContinue && G.phase === 'lose';
    let by = 400;
    if (canCont) {
      btn(40, by, W - 80, 46, '광고 보고 이어하기', continueRun, { bg:'#2b4a3a', on:true, fs:14, sub:'수호석 50% 회복 · 1회만', sc:'#9ae8b5' });
      by += 54;
    }
    if (canDouble) {
      btn(40, by, W - 80, 46, '광고 보고 수정 2배', doubleReward, { bg:'#2a4659', on:true, fs:14, sub:'◆' + G.gems + ' → ◆' + (G.gems * 2), sc:'#8be9ff' });
      by += 54;
    }
    if (G.doubled) { txt('수정 2배 적용됨', W / 2, by + 14, 12, '#6bdc7a', 'center'); by += 34; }
    btn(100, by, W - 200, 40, '나가기', () => {
      scene = 'stages'; L.msg = '수정으로 부하와 함정을 더 모아보세요';
      if (SAVE.battles % 3 === 0) ADS.interstitial();
    }, { fs:13 });
  }
}
function draw() {
  scene === 'lobby' ? drawLobby() : scene === 'stages' ? drawStages() : drawGame();
  advDraw();
}

/* ================= 입력 ================= */
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
/* 화면 좌표 -> 바닥(y=0) 월드 좌표 */
function unproject(sx, sy) {
  const dx = (sx - RT.cx) / FOV, dy = -(sy - RT.cy) / FOV;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const den = dy * cp - sp;
  if (Math.abs(den) < 1e-4) return null;
  const t = (-cam.ty - cam.dist * sp) / den;
  if (t <= 0) return null;
  const vx = dx * t, vy = dy * t, vz = t - cam.dist;
  const z1 = vy * sp + vz * cp;
  const cy1 = Math.cos(cam.yaw), sy1 = Math.sin(cam.yaw);
  return [cam.tx + vx * cy1 - z1 * sy1, cam.tz + vx * sy1 + z1 * cy1];
}
function tap(x, y) {
  if (ADV.on) {
    for (const b of BTN) if (b.label && String(b.label).indexOf('광고') === 0 && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.tap(); b.act(); return; }
    return;
  }
  if (scene === 'lobby' || scene === 'stages') {
    if (scene === 'lobby' && L.result) { L.result = null; SFX.tap(); return; }
    for (const b of BTN) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.tap(); b.act(); return; }
    return;
  }
  if (G.phase === 'win' || G.phase === 'lose') { for (const b of BTN) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.tap(); b.act(); return; } return; }
  for (const b of BTN) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.tap(); b.act(); return; }
  if (y >= PANEL_Y) return;
  if (G.aim) { const w = unproject(x, y); if (w) dropMeteor(w[0], w[1]); return; }
  let hit = -1, best = 34;
  for (let i = 0; i < NROOM; i++) {
    const s = proj(ROOMS[i].x, 10, ROOMS[i].z); if (!s) continue;
    const d = Math.hypot(s[0] - x, s[1] - y);
    if (d < best) { best = d; hit = i; }
  }
  if (hit >= 0) { if (G.moveFrom >= 0) doMove(hit); else G.sel = (G.sel === hit ? -1 : hit); return; }
  G.sel = -1; G.moveFrom = -1;
}
const PT = new Map();
/* 탭 판정은 '누적 이동량'이 아니라 '처음 누른 지점에서 떨어진 거리'로 한다.
   누적으로 재면 손가락이 제자리에서 미세하게 떨리기만 해도 드래그로 오인된다. */
const TAP_SLOP = 16;
let startPt = null, maxMove = 0, primaryId = null, orbiting = false, pinch0 = 0, dist0 = 0, multi = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); SFX.unlock();
  const p = toCanvas(e); PT.set(e.pointerId, p);
  if (PT.size === 1) {
    primaryId = e.pointerId; startPt = p; maxMove = 0; multi = false;
    orbiting = scene === 'game' && p[1] < PANEL_Y;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  } else {
    const a = [...PT.values()];
    pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    dist0 = cam.dist; orbiting = false; multi = true; startPt = null;
  }
});
cv.addEventListener('pointermove', e => {
  if (!PT.has(e.pointerId)) return;
  const p = toCanvas(e), prev = PT.get(e.pointerId); PT.set(e.pointerId, p);
  if (PT.size >= 2) {
    const a = [...PT.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    if (pinch0 > 4 && d > 4) { cam.dist = Math.max(180, Math.min(900, dist0 * pinch0 / d)); camManual = true; }
    return;
  }
  if (e.pointerId !== primaryId || !startPt) return;
  const off = Math.hypot(p[0] - startPt[0], p[1] - startPt[1]);
  if (off > maxMove) maxMove = off;
  if (orbiting && maxMove > TAP_SLOP) {
    cam.yaw -= (p[0] - prev[0]) * 0.009;
    cam.pitch = Math.max(0.22, Math.min(1.552, cam.pitch + (p[1] - prev[1]) * 0.006));
    camManual = true;
  }
});
function endPointer(e) {
  if (!PT.has(e.pointerId)) return;
  const p = PT.get(e.pointerId); PT.delete(e.pointerId);
  const wasPrimary = e.pointerId === primaryId;
  if (PT.size === 0) {
    if (wasPrimary && startPt && !multi && maxMove <= TAP_SLOP) tap(p[0], p[1]);
    orbiting = false; startPt = null; primaryId = null; multi = false;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(180, Math.min(900, cam.dist + e.deltaY * 0.6)); camManual = true; }, { passive:false });

/* ================= 루프 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  T += dt;
  advStep(dt);
  if (scene === 'game' && !ADV.on) {
    if (G.hs > 0) G.hs -= dt;                      /* 히트스톱: 시뮬레이션만 멈추고 화면은 계속 그린다 */
    else for (let i = 0; i < G.speed; i++) update(dt);
    camStep(dt);
  }
  draw();
  requestAnimationFrame(loop);
}
camSnap('prep');
requestAnimationFrame(loop);
</script>
</body>
