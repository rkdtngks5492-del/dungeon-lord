name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug:
    name: 디버그 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 래퍼 생성
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Android SDK 라이선스 동의
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: google-services.json 준비
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android-app/app/google-services.json
          else
            cat > android-app/app/google-services.json << 'EOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "dungeon-lord-debug", "storage_bucket": "dungeon-lord-debug.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.dungeonlord.game" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaPlaceholder" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: 디버그 APK 빌드
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-lord-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
